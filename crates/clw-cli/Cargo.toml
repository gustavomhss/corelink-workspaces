[package]
name = "clw-cli"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "clw"
path = "src/main.rs"

[dependencies]
clw-types = { workspace = true }
clw-snapshot = { workspace = true }
clw-hydrate = { workspace = true }
clw-run = { workspace = true }
clw-manifest = { workspace = true }
clw-cache = { workspace = true }
clw-client = { workspace = true }
clap = { workspace = true, features = ["env"] }
# Shell-completion generator for `clw completions <shell>`. MIT/Apache-2.0
# (both already in deny.toml [licenses].allow / about.toml accepted) and pinned
# to clap's 4.x line so the generated completions track the derived CLI surface.
clap_complete = "4"
tokio = { workspace = true }
# Bounded-concurrent record fetches for `ls --all` (avoids the N+1 sequential
# per-ref round-trips). Same 0.3 line already vetted via clw-snapshot.
futures = "0.3"
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Windows-only Win32 FFI used to ACL-restrict the PAT-bearing ~/.clw/config.toml
# (and ~/.clw dir) to the current owner — the Windows analogue of the unix
# 0600/0700 hardening, which is a no-op there. Target-scoped to cfg(windows) so
# it never enters the unix build/lock/`cargo deny` graph. MIT/Apache-2.0
# (already in deny.toml [licenses].allow + about.toml accepted). Feature modules
# below are the minimal set for: current-process token + user-SID lookup
# (Threading), ACL build (Security), the named-object DACL apply (Authorization),
# local heap alloc for the SID buffer (Memory), and shared Win32 types (Foundation).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Memory",
] }

[dev-dependencies]
# Pre-added by the lead (wave-0) so W14-e2e never edits this file (conflict defusal).
assert_cmd = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true }
# Test-only: implement the AcTransport/CasTransport async traits for in-crate
# fakes (e.g. erase.rs's eventually-consistent transport). Already a workspace
# dependency (license-approved, in the lockfile); used here only by tests.
async-trait = { workspace = true }
# Property-based robustness tests (config-line parser never panics on arbitrary
# input). Already a workspace dev-dep; no new external crate enters the graph.
proptest = { workspace = true }
