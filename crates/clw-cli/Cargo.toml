[package]
name = "clw-cli"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "clw"
path = "src/main.rs"

[dependencies]
clw-types = { workspace = true }
clw-snapshot = { workspace = true }
clw-hydrate = { workspace = true }
clw-run = { workspace = true }
clw-manifest = { workspace = true }
clw-cache = { workspace = true }
clw-client = { workspace = true }
clap = { workspace = true, features = ["env"] }
# Shell-completion generator for `clw completions <shell>`. MIT/Apache-2.0
# (both already in deny.toml [licenses].allow / about.toml accepted) and pinned
# to clap's 4.x line so the generated completions track the derived CLI surface.
clap_complete = "4"
tokio = { workspace = true }
# Bounded-concurrent record fetches for `ls --all` (avoids the N+1 sequential
# per-ref round-trips). Same 0.3 line already vetted via clw-snapshot.
futures = "0.3"
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The one audited `unsafe` block in the workspace lives in this crate, not here.
# See crates/clw-win-acl/src/lib.rs for why it was split out: it lets clw-cli —
# the crate that handles the plaintext PAT — sit at `forbid`, where the compiler
# enforces the posture and no regex is in the trust path.
clw-win-acl = { workspace = true }

[dev-dependencies]
# Pre-added by the lead (wave-0) so W14-e2e never edits this file (conflict defusal).
assert_cmd = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true }
# Test-only: implement the AcTransport/CasTransport async traits for in-crate
# fakes (e.g. erase.rs's eventually-consistent transport). Already a workspace
# dependency (license-approved, in the lockfile); used here only by tests.
async-trait = { workspace = true }
# Property-based robustness tests (config-line parser never panics on arbitrary
# input). Already a workspace dev-dep; no new external crate enters the graph.
proptest = { workspace = true }

# clw-cli inherits the workspace lints, which include
# `unsafe_code = "forbid"`. It used to sit at `deny` so that one Windows-DACL
# block could be `#[allow]`ed inside it — which put all 8,554 lines of this
# crate somewhere `unsafe` could be reintroduced with the compiler silent.
# The block now lives in `clw-win-acl`; this crate is back under the compiler.
[lints]
workspace = true
