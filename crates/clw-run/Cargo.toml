[package]
name = "clw-run"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clw-types = { workspace = true }
clw-manifest = { workspace = true }
clw-client = { workspace = true }
tokio = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

# Reuse the locked safe API for effective Unix executable permissions.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
criterion = { workspace = true }
# Property-based robustness tests (RunRecord parse never panics on arbitrary
# bytes). Already a workspace dev-dep; no new external crate.
proptest = { workspace = true }

[[bench]]
name = "run_key"
harness = false

[lints]
workspace = true
