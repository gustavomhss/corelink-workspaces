# cargo-about configuration — third-party attribution bundle for the
# proprietary CoreLink Workspaces (clw) binary distribution.
#
# WP M4.2 (license posture + EULA). `cargo about generate` walks the dependency
# graph, collects the license text of every shipped third-party crate, and
# renders it into an attribution document (referenced from NOTICE). The output
# filename is THIRD-PARTY-LICENSES.md, matching what release.yml publishes
# alongside the binaries. The committed `about.hbs` template emits Markdown:
#
#     cargo about generate about.hbs > THIRD-PARTY-LICENSES.md
#
# ---------------------------------------------------------------------------
# SINGLE SOURCE OF TRUTH:
#   The `accepted` allow-list below MUST stay consistent with the [licenses]
#   `allow` list in deny.toml. deny.toml is the supply-chain GATE (it FAILS CI
#   if a crate carries a license outside the set); about.toml is the
#   ATTRIBUTION generator over that same set. The permissive set is, by family:
#   Apache-2.0 / MIT / BSD / ISC / Unicode / CDLA-Permissive-2.0 / Zlib (plus
#   the additional attribution-only / public-domain atoms actually present in
#   Cargo.lock). When you change one file's list, change the other and keep
#   this note pointing at deny.toml.
#
#   The first-party clw-* crates are publish=false and proprietary
#   (LicenseRef-Proprietary); they are excluded from the third-party bundle via
#   the workspace settings below — only third-party dependencies are attributed.
# ---------------------------------------------------------------------------

# NOTE: whole-workspace attribution is selected via the `--workspace` CLI flag on
# `cargo about generate` — cargo-about 0.9 REMOVED the top-level `workspace` and
# `no-clearly-defined` config keys (`workspace` is now a flag). Keeping them here
# is a hard parse error. See the THIRD-PARTY step in release.yml for the flag.

# Do not attribute the first-party clw-* crates themselves; they are the
# proprietary product (publish=false), not a third-party component to be
# license-listed.
private = { ignore = true }

# Accepted licenses (kept consistent with deny.toml [licenses].allow — the
# third-party permissive set; the first-party LicenseRef-Proprietary atom lives
# only in deny.toml and is excluded here via `private.ignore`).
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
