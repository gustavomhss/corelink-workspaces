# Fuzz lane — actually RUN the cargo-fuzz harness that already exists but was dormant.
#
# Part of the test-rigor wave. The 6 targets under fuzz/ fuzz the UNTRUSTED-input
# parsers/validators of clw-types (the path-escape / manifest-parse attack surface).
# They were only runnable via the opt-in local lane; this schedules them so a crash
# becomes a VISIBLE red instead of a latent bug.
#
# Blocking posture (unlike coverage/mutation): a crash ALWAYS fails the run — a panic
# or sanitizer trip on arbitrary input is a real defect, not a ratchetable metric.
#
# cargo-fuzz REQUIRES nightly (-Z build-std / libFuzzer wiring); the workspace is
# stable-pinned, and fuzz/ is a detached out-of-workspace package precisely so the
# main stable gate never sees libfuzzer-sys. Both jobs use fresh standard
# GitHub-hosted Ubuntu VMs. Nightly and cargo-fuzz are provisioned explicitly
# without mutating a shared developer machine.

name: fuzz

on:
  schedule:
    - cron: "0 8 * * *"   # nightly 08:00 UTC (offset from conformance 13:00 / deadman 16:00 / metered Mon 12:00)
  workflow_dispatch:

concurrency:
  group: fuzz
  cancel-in-progress: false

permissions:
  contents: read

# Fuzzing compiles and executes repository-controlled code on the CoreLink
# fabric. Never let the fabric's ambient broker identity reach it.
env:
  # CI_CREDENTIAL_NULL_GUARD: workflow-env
  CLW_CRED_TICKET: ""
  CLW_LEASE_ID: ""
  CLW_FABRIC_ENDPOINT: ""

jobs:
  supply-chain:
    name: fuzz supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: assert broker credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          for credential in CLW_CRED_TICKET CLW_LEASE_ID CLW_FABRIC_ENDPOINT; do
            [ -z "${!credential:-}" ] || {
              echo "::error::fuzz broker credential must be empty: ${credential}"
              exit 1
            }
          done
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `gates.sh` runs the normal full gate before its opt-in fuzz tail, so
      # materialize the repository's pinned stable toolchain and both policy tools.
      - name: install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show

      - name: install cargo-deny + cargo-audit (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8,cargo-audit@0.22.2

      # The full gate's Windows cross-check compiles ring's C build script.
      - name: ensure mingw-w64 (windows-gnu cross-CC for ring's C build)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      # This must remain an execution, not merely an environment declaration:
      # gates.sh prints "FUZZ supply-chain lane GREEN" only after deny + audit
      # have accepted fuzz/Cargo.lock and fuzz/deny.toml.
      - name: gate locked fuzz dependency graph
        run: CLW_FUZZ_GATE=1 bash scripts/gates.sh

  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false   # one crashing target must not hide the others' results
      matrix:
        target:
          - fuzz_manifest_from_bytes
          - fuzz_validate_rel_path
          - fuzz_validate_symlink_target_contained
          - fuzz_digest_from_hex
          - fuzz_ref_record_from_bytes
          - fuzz_validate_tenant
    steps:
      - name: assert broker credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          for credential in CLW_CRED_TICKET CLW_LEASE_ID CLW_FABRIC_ENDPOINT; do
            [ -z "${!credential:-}" ] || {
              echo "::error::fuzz broker credential must be empty: ${credential}"
              exit 1
            }
          done
      - uses: actions/checkout@v4

      - name: verify fuzz target and seed-corpus inventory
        run: bash scripts/fuzz-selftest.sh

      - name: install nightly toolchain (cargo-fuzz requires it)
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup component add --toolchain nightly rust-src   # -Z build-std needs rust-src

      # cargo-fuzz 0.13.2 has no `cargo fuzz run --locked` form. Resolve the
      # detached workspace explicitly before invoking it, so a stale committed
      # lock fails rather than being silently regenerated by Cargo. Refresh
      # fuzz/Cargo.lock whenever the workspace package version changes.
      - name: verify fuzz dependency graph is locked
        run: |
          set -euo pipefail
          (cd fuzz && cargo metadata --locked --format-version 1 >/dev/null)

      # The GitHub Actions API's refs/tags/v4.2.4 reports this immutable commit
      # SHA (verified 2026-09-02):
      # https://api.github.com/repos/actions/cache/git/ref/tags/v4.2.4
      # Restore and save are separate because a cache key is immutable. Every
      # successful run restores the newest target corpus then saves its growth
      # under this run's fresh key; no successful corpus is overwritten.
      - name: restore persistent corpus (${{ matrix.target }})
        id: corpus-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-v1-${{ matrix.target }}-

      - name: install cargo-fuzz 0.13.2
        # NOT a first-class taiki-e/install-action tool (its cargo-binstall fallback for
        # cargo-fuzz is unreliable) — install deterministically from source. The cargo-fuzz
        # CLI builds on stable; only RUNNING targets needs nightly (done below).
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      # A cache miss bootstraps from the tracked seed and is saved. On every
      # restored run, the helper evaluates the seed-only and restored corpora
      # with the same no-mutation budget before further fuzzing, and requires
      # the restored corpus's maximum `cov:` count to be strictly greater.
      - name: fuzz ${{ matrix.target }} and prove restored-corpus coverage
        run: bash scripts/fuzz-coverage-check.sh "${{ matrix.target }}" "${{ steps.corpus-cache.outputs.cache-matched-key != '' }}"

      - name: save persistent corpus (${{ matrix.target }})
        if: success()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-v1-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      # On a crash the step above fails (set -e); capture the reproducing input +
      # corpus so the failure is reproducible from the run artifacts.
      - name: upload crash artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            fuzz/artifacts/**
            fuzz/corpus/**
          if-no-files-found: warn
