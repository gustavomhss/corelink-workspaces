# Fuzz lane — actually RUN the cargo-fuzz harness that already exists but was dormant.
#
# Part of the test-rigor wave. The 4 targets under fuzz/ fuzz the UNTRUSTED-input
# parsers/validators of clw-types (the path-escape / manifest-parse attack surface).
# They were only runnable via the opt-in local lane; this schedules them so a crash
# becomes a VISIBLE red instead of a latent bug.
#
# Blocking posture (unlike coverage/mutation): a crash ALWAYS fails the run — a panic
# or sanitizer trip on arbitrary input is a real defect, not a ratchetable metric.
#
# cargo-fuzz REQUIRES nightly (-Z build-std / libFuzzer wiring); the workspace is
# stable-pinned, and fuzz/ is a detached out-of-workspace package precisely so the
# main stable gate never sees libfuzzer-sys. Runs on `corelink` — CoreLink's OWN ephemeral
# CF-Firecracker runner fabric (zero hosted-Actions spend; org mandate "self-hosted tudo ou
# não roda"). Each box is a fresh microVM, so `rustup toolchain install nightly` + a source
# `cargo install cargo-fuzz` are clean per run (no shared-$HOME hazard — that only bites the
# Mac fleet, not these one-shot boxes).

name: fuzz

on:
  schedule:
    - cron: "0 8 * * *"   # nightly 08:00 UTC (offset from conformance 13:00 / deadman 16:00 / metered Mon 12:00)
  workflow_dispatch:

concurrency:
  group: fuzz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  supply-chain:
    name: fuzz supply-chain
    runs-on: corelink
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `gates.sh` runs the normal full gate before its opt-in fuzz tail, so
      # materialize the repository's pinned stable toolchain and both policy tools.
      - name: install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show

      - name: install cargo-deny + cargo-audit (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8,cargo-audit@0.22.2

      # The full gate's Windows cross-check compiles ring's C build script.
      - name: ensure mingw-w64 (windows-gnu cross-CC for ring's C build)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      # This must remain an execution, not merely an environment declaration:
      # gates.sh prints "FUZZ supply-chain lane GREEN" only after deny + audit
      # have accepted fuzz/Cargo.lock and fuzz/deny.toml.
      - name: gate locked fuzz dependency graph
        run: CLW_FUZZ_GATE=1 bash scripts/gates.sh

  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: corelink
    timeout-minutes: 20
    strategy:
      fail-fast: false   # one crashing target must not hide the others' results
      matrix:
        target:
          - fuzz_manifest_from_bytes
          - fuzz_validate_rel_path
          - fuzz_validate_symlink_target
          - fuzz_digest_from_hex
    steps:
      - uses: actions/checkout@v4

      - name: install nightly toolchain (cargo-fuzz requires it)
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup component add --toolchain nightly rust-src   # -Z build-std needs rust-src

      # cargo-fuzz 0.13.2 has no `cargo fuzz run --locked` form. Resolve the
      # detached workspace explicitly before invoking it, so a stale committed
      # lock fails rather than being silently regenerated by Cargo. Refresh
      # fuzz/Cargo.lock whenever the workspace package version changes.
      - name: verify fuzz dependency graph is locked
        run: |
          set -euo pipefail
          (cd fuzz && cargo metadata --locked --format-version 1 >/dev/null)

      - name: install cargo-fuzz 0.13.2
        # NOT a first-class taiki-e/install-action tool (its cargo-binstall fallback for
        # cargo-fuzz is unreliable) — install deterministically from source. The cargo-fuzz
        # CLI builds on stable; only RUNNING targets needs nightly (done below).
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      # 5 minutes per target. cargo-fuzz operates on the fuzz/ package (detached
      # workspace at repo root); run from the repo root, which is where fuzz/ lives.
      - name: fuzz ${{ matrix.target }} (5 min)
        run: |
          set -euo pipefail
          lock_before="$(sha256sum fuzz/Cargo.lock | awk '{print $1}')"
          set +e
          cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time=300 -rss_limit_mb=4096
          fuzz_exit=$?
          set -e
          lock_after="$(sha256sum fuzz/Cargo.lock | awk '{print $1}')"
          if [ "$lock_before" != "$lock_after" ]; then
            echo "::error::cargo-fuzz changed fuzz/Cargo.lock despite the locked metadata preflight" >&2
            git diff -- fuzz/Cargo.lock >&2 || true
            exit 1
          fi
          exit "$fuzz_exit"

      # On a crash the step above fails (set -e); capture the reproducing input +
      # corpus so the failure is reproducible from the run artifacts.
      - name: upload crash artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: |
            fuzz/artifacts/**
            fuzz/corpus/**
          if-no-files-found: warn
