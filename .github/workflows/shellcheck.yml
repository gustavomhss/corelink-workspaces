# Lint lane — lint the distribution + CI shell scripts and every workflow.
#
# `scripts/install.sh` is the PUBLIC curl-pipe fallback a customer runs to install clw; a
# broken script there is a real user hazard, and the release/gate scripts are load-bearing.
# They were never shellcheck-gated. This runs shellcheck on all of scripts/*.sh;
# actionlint checks the workflow syntax and expressions that orchestrate them.
#
# Standard GitHub-hosted Ubuntu; no CoreLink runner or local Mac is required.

name: lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Shellcheck and actionlint consume checkout-controlled scripts/workflows on PRs.
env:
  # CI_CREDENTIAL_NULL_GUARD: workflow-env
  CLW_CRED_TICKET: ""
  CLW_LEASE_ID: ""
  CLW_FABRIC_ENDPOINT: ""

jobs:
  lint:
    name: shellcheck + actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: assert PR broker credentials are absent
        if: github.event_name == 'pull_request' || startsWith(github.event_name, 'pull_request_')
        shell: bash
        run: |
          set -euo pipefail
          for credential in CLW_CRED_TICKET CLW_LEASE_ID CLW_FABRIC_ENDPOINT; do
            [ -z "${!credential:-}" ] || {
              echo "::error::PR broker credential must be empty: ${credential}"
              exit 1
            }
          done
      - uses: actions/checkout@v4
      # Install the workflow linter explicitly on the fresh Ubuntu VM.
      - name: install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck
      - name: install actionlint 1.7.12 (checksum-pinned prebuilt)
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          bin_dir="$RUNNER_TEMP/actionlint-1.7.12"
          trap 'rm -f "$archive"' EXIT
          curl -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" actionlint
          echo "$bin_dir" >> "$GITHUB_PATH"
      - name: shellcheck (warning level — errors + warnings fail)
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck -S warning scripts/*.sh
          echo "all scripts/*.sh pass shellcheck"
      - name: actionlint (workflows + standard GitHub-hosted runner labels)
        run: |
          set -euo pipefail
          actionlint -version
          actionlint
          echo "all workflows pass actionlint"
