name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One CI run at a time per ref (cancel superseded runs to save hosted minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_TERM_COLOR: always

jobs:
  gates:
    # GitHub-hosted ubuntu is the authoritative lane: it runs INSIDE GitHub's
    # network and never traverses the public self-hosted-runner session endpoint
    # (pipelines.actions.githubusercontent.com), so a single self-hosted Mac is no
    # longer a merge SPOF. (2026-07-20: an expired cert on that public endpoint
    # wedged every self-hosted runner while github-hosted jobs stayed green — this
    # move makes the required gate immune to that class of outage. The gate is
    # platform-agnostic; the OS-divergent target (Windows) is covered by the
    # windows-gnu cross-check below + the separate windows-runtime lane.)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ubuntu-latest ships rustup; rust-toolchain.toml pins the channel (1.91.1)
      # and its components (rustfmt, clippy), which rustup auto-installs. `rustup
      # show` in the repo root forces that install now so a download failure surfaces
      # here rather than mid-gate.
      - name: install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      # Provision the supply-chain tools as PREBUILT binaries (gates.sh runs
      # `cargo deny check` + `cargo audit`).
      - name: install cargo-deny + cargo-audit (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8,cargo-audit@0.22.2
      # The windows-gnu cross-CHECK in gates.sh compiles `ring`'s C build script,
      # which needs the mingw-w64 cross-CC (x86_64-w64-mingw32-gcc).
      - name: ensure mingw-w64 (windows-gnu cross-CC for ring's C build)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: gates (fmt + clippy + test + supply-chain + windows cross-check)
        run: bash scripts/gates.sh

  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fetch base ref
        run: git fetch origin ${{ github.base_ref || 'main' }} --no-tags
      - name: DCO trailer check
        run: bash scripts/dco-check.sh origin/${{ github.base_ref || 'main' }}
