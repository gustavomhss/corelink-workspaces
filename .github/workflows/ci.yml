name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One CI run at a time per ref (cancel superseded runs to save hosted minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Ephemeral GitHub-hosted runner: a fresh rustup per run, so there is NO
      # shared-host "rustup-nuke" to defend against (the reason the old self-hosted
      # Mac used an isolated CARGO_HOME). rust-toolchain.toml pins 1.91.1 + rustfmt
      # + clippy; `rustup show` eagerly installs them so a toolchain problem fails
      # here, not mid-gate.
      - name: install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      # Provision the supply-chain tools as PREBUILT binaries (fast; no per-run
      # `cargo install` compile). gates.sh runs `cargo deny check` + `cargo audit`.
      - name: install cargo-deny + cargo-audit (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8,cargo-audit
      # The windows-gnu cross-CHECK in gates.sh compiles `ring`'s C build script,
      # which needs the mingw-w64 cross-CC (`x86_64-w64-mingw32-gcc`). The old
      # self-hosted Mac had it via brew; ubuntu-latest does not preinstall it.
      - name: install mingw-w64 (windows-gnu cross-CC for ring's C build)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
      - name: gates (fmt + clippy + test + supply-chain + windows cross-check)
        run: bash scripts/gates.sh

  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fetch base ref
        run: git fetch origin ${{ github.base_ref || 'main' }} --no-tags
      - name: DCO trailer check
        run: bash scripts/dco-check.sh origin/${{ github.base_ref || 'main' }}
