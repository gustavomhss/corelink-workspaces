name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One CI run at a time per ref — protects the (owner-chosen) self-hosted Mac.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: [self-hosted, macOS]
    # 45 (was 30) to absorb the ONE-TIME cold build when the isolated
    # CARGO_HOME/RUSTUP_HOME below is first populated (fresh toolchain + registry
    # download). Subsequent runs reuse the warm isolated home and finish in minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Isolate clw's Rust toolchain from the SHARED ~/.rustup + ~/.cargo on this
      # multi-project self-hosted Mac. A sibling project's CI deleting ~/.rustup
      # (the recurring "rustup-nuke" — root-caused 2026-06-16 to a NON-CoreLink job;
      # corelink-server greped its workflows clean) otherwise dangles clw's cargo
      # shims and breaks `gates.sh` with `cargo: command not found` (exit 127). A
      # clw-dedicated CARGO_HOME/RUSTUP_HOME survives that, and self-heals if absent.
      - name: isolate + ensure clw Rust toolchain (immune to the shared-host rustup-nuke)
        run: |
          set -euo pipefail
          CLW_RUST="$HOME/.clw-ci-rust"
          echo "CARGO_HOME=$CLW_RUST/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$CLW_RUST/rustup" >> "$GITHUB_ENV"
          echo "$CLW_RUST/cargo/bin" >> "$GITHUB_PATH"
          if [ ! -x "$CLW_RUST/cargo/bin/rustup" ]; then
            echo "isolated rustup absent — installing (clw-dedicated, one-time)"
            export CARGO_HOME="$CLW_RUST/cargo" RUSTUP_HOME="$CLW_RUST/rustup"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --default-toolchain none --profile minimal
          fi
          # rust-toolchain.toml pins the exact version; rustup auto-installs it in the
          # isolated RUSTUP_HOME on the first cargo call inside the repo.
          "$CLW_RUST/cargo/bin/rustup" --version
      - name: gates (fmt + clippy + test)
        run: bash scripts/gates.sh

  dco:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fetch base ref
        run: git fetch origin ${{ github.base_ref || 'main' }} --no-tags
      - name: DCO trailer check
        run: bash scripts/dco-check.sh origin/${{ github.base_ref || 'main' }}
