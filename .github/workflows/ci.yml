name: ci
on:
  pull_request:
  push:
    branches: [main]

# One CI run at a time per ref — protects the (owner-chosen) self-hosted Mac.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: gates (fmt + clippy + test)
        run: bash scripts/gates.sh
