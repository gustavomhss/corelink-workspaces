name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One CI run at a time per ref (cancel superseded runs to save hosted minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimum scope for the whole workflow. Declaring ANY block resets every scope the
# block does not name to `none`, so this narrows GITHUB_TOKEN from the repository
# default (read on every scope) to read on `contents` alone. `contents: read` is the
# floor because every job here runs actions/checkout@v4, which clones via the token.
# No job in this workflow calls `gh`, uploads/downloads artifacts, writes a check,
# or comments on a PR — so nothing needs an elevation, and none is granted. A job
# that later needs more must elevate LOCALLY (a `permissions:` block on that job)
# with a written justification, never by widening this one.
permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "4"
  CARGO_TERM_COLOR: always
  # Expressions are data, never shell source. Keep the ref out of `run:` so a
  # future event-field change cannot turn the DCO fetch into shell injection.
  BASE_REF: ${{ github.base_ref || 'main' }}
  # CI_CREDENTIAL_NULL_GUARD: workflow-env
  # Every pull_request job checks out author-controlled input. Blank the runner
  # fabric's one-shot broker credential trio before any such job can build, test,
  # or execute repository scripts; gates.sh proves this scope and each checkout.
  CLW_CRED_TICKET: ""
  CLW_LEASE_ID: ""
  CLW_FABRIC_ENDPOINT: ""

jobs:
  gates:
    # Runs on `corelink` — CoreLink's OWN ephemeral CF-Firecracker runner fabric (zero
    # hosted-Actions spend; org mandate "self-hosted tudo ou não roda"). Each box is an
    # ephemeral microVM, NOT the single self-hosted Mac, so this required gate has no
    # shared-box SPOF: the 2026-07-20 class of outage (an expired cert wedging every
    # Mac-backed runner) does not apply to per-lease Firecracker boxes, and if the fabric
    # itself is down the job fails-to-start = RED, the correct signal for a required check.
    # The gate is platform-agnostic; the OS-divergent target (Windows) is covered by the
    # windows-gnu cross-check below + the separate windows-runtime lane.
    runs-on: corelink
    timeout-minutes: 30
    steps:
      - name: assert PR broker credentials are absent
        if: github.event_name == 'pull_request' || startsWith(github.event_name, 'pull_request_')
        shell: bash
        run: |
          set -euo pipefail
          for credential in CLW_CRED_TICKET CLW_LEASE_ID CLW_FABRIC_ENDPOINT; do
            [ -z "${!credential:-}" ] || {
              echo "::error::PR broker credential must be empty: ${credential}"
              exit 1
            }
          done
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: prove PR broker credential guard has teeth
        if: github.event_name == 'pull_request'
        run: bash scripts/gates.sh --selftest-pr-credential-null
      # The `corelink` image ships rustup + the pinned toolchain baked; `rustup show`
      # reads rust-toolchain.toml (1.91.1 + rustfmt/clippy) and resolves it with zero
      # per-spawn download. A download failure (if the pin ever drifts) surfaces here
      # rather than mid-gate.
      - name: install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      # Provision the supply-chain tools as PREBUILT binaries (gates.sh runs
      # `cargo deny check` + `cargo audit`).
      - name: install cargo-deny + cargo-audit (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8,cargo-audit@0.22.2
      # The windows-gnu cross-CHECK in gates.sh compiles `ring`'s C build script,
      # which needs the mingw-w64 cross-CC (x86_64-w64-mingw32-gcc).
      - name: ensure mingw-w64 (windows-gnu cross-CC for ring's C build)
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: gates (fmt + clippy + test + supply-chain + windows cross-check)
        run: bash scripts/gates.sh

  dco:
    # Same `corelink` ephemeral fabric — pure git + bash, no toolchain (zero hosted spend).
    runs-on: corelink
    timeout-minutes: 5
    steps:
      - name: assert PR broker credentials are absent
        if: github.event_name == 'pull_request' || startsWith(github.event_name, 'pull_request_')
        shell: bash
        run: |
          set -euo pipefail
          for credential in CLW_CRED_TICKET CLW_LEASE_ID CLW_FABRIC_ENDPOINT; do
            [ -z "${!credential:-}" ] || {
              echo "::error::PR broker credential must be empty: ${credential}"
              exit 1
            }
          done
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fetch base ref
        run: git fetch origin "$BASE_REF" --no-tags
      - name: DCO trailer check
        run: bash scripts/dco-check.sh "origin/$BASE_REF"

  gate-check-selftest:
    # Same `corelink` ephemeral fabric — pure bash + python3, no toolchain (zero hosted
    # spend). Proves scripts/pre-merge-gate-check.sh (the mandatory pre-merge gate, see
    # its header) still refuses CONFLICTING/UNKNOWN/zero-checks/missing-always-present-
    # gate and still allows a healthy PR, against a stubbed `gh` — so the safety script
    # keeps proving itself on every PR that touches it, instead of silently bit-rotting.
    runs-on: corelink
    timeout-minutes: 5
    steps:
      - name: assert PR broker credentials are absent
        if: github.event_name == 'pull_request' || startsWith(github.event_name, 'pull_request_')
        shell: bash
        run: |
          set -euo pipefail
          for credential in CLW_CRED_TICKET CLW_LEASE_ID CLW_FABRIC_ENDPOINT; do
            [ -z "${!credential:-}" ] || {
              echo "::error::PR broker credential must be empty: ${credential}"
              exit 1
            }
          done
      - uses: actions/checkout@v4
      - name: pre-merge-gate-check self-test
        run: bash scripts/pre-merge-gate-check-selftest.sh

  release-guards-selftest:
    # Pure bash + git + jq, fully offline. Exercises release security decisions on
    # every PR without spending a tag or touching release/publish credentials.
    runs-on: corelink
    timeout-minutes: 5
    steps:
      - name: assert PR broker credentials are absent
        if: github.event_name == 'pull_request' || startsWith(github.event_name, 'pull_request_')
        shell: bash
        run: |
          set -euo pipefail
          for credential in CLW_CRED_TICKET CLW_LEASE_ID CLW_FABRIC_ENDPOINT; do
            [ -z "${!credential:-}" ] || {
              echo "::error::PR broker credential must be empty: ${credential}"
              exit 1
            }
          done
      - uses: actions/checkout@v4
      - name: release guards self-test
        run: bash scripts/release-guards-selftest.sh
