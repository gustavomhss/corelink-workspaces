# Coverage lane — MEASURE test coverage so "is it tested?" stops being an opinion.
#
# Part of the test-rigor wave (make robustness PROVABLE). This lane is ADDITIVE: it
# does NOT touch the required `gates`/`dco` checks or scripts/gates.sh. Posture is
# MEASURE -> RATCHET -> GATE:
#   * Phase 1a: REPORT-ONLY. Printed total line coverage to establish a baseline.
#   * Phase 1b (now): floor 88%. A drop fails deterministically (same tests =>
#     same %), so this is a real quality gate rather than a report-only metric.
#   * Phase 1c: promote to a required check once stable; ratchet the floor upward.
#
# Standard GitHub-hosted Ubuntu; no CoreLink runner or local Mac is required.
# Default-features only: no live backend credentials are used in coverage.

name: coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Coverage compiles and runs PR-controlled Rust. The runner fabric's broker
# credential trio must be empty before the checkout can reach a build/test step.
env:
  # CI_CREDENTIAL_NULL_GUARD: workflow-env
  CLW_CRED_TICKET: ""
  CLW_LEASE_ID: ""
  CLW_FABRIC_ENDPOINT: ""

jobs:
  coverage:
    name: llvm-cov (floor 88%)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: assert PR broker credentials are absent
        if: github.event_name == 'pull_request' || startsWith(github.event_name, 'pull_request_')
        shell: bash
        run: |
          set -euo pipefail
          for credential in CLW_CRED_TICKET CLW_LEASE_ID CLW_FABRIC_ENDPOINT; do
            [ -z "${!credential:-}" ] || {
              echo "::error::PR broker credential must be empty: ${credential}"
              exit 1
            }
          done
      - uses: actions/checkout@v4

      # Materialize the pinned toolchain (rust-toolchain.toml = 1.91.1) + the
      # instrumentation component llvm-cov needs.
      - name: install pinned toolchain + llvm-tools
        run: |
          set -euo pipefail
          rustup show
          rustup component add llvm-tools-preview

      - name: install cargo-llvm-cov (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0

      # Run the workspace tests ONCE with instrumentation (--no-report collects the
      # profile), then emit lcov + JSON from the same run without re-testing.
      # Default-features: the `live` conformance suite is not compiled/run (no backend).
      # `clw-e2e-evidence` is EXCLUDED: it is a user-simulating test harness whose
      # bin/journeys exist to DRIVE the real clw binary (measured as uncovered lines by
      # llvm-cov, since they run a subprocess) — measuring its line coverage is
      # meaningless and would drag the product-code floor. Its own logic (model/report/
      # redaction) is unit-tested within the crate regardless.
      - name: measure coverage (workspace, default-features)
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --exclude clw-e2e-evidence --no-report
          IGN='crates/clw-e2e-evidence/'
          cargo llvm-cov report --ignore-filename-regex "$IGN" --lcov --output-path lcov.info
          cargo llvm-cov report --ignore-filename-regex "$IGN" --json --output-path coverage.json
          cargo llvm-cov report --ignore-filename-regex "$IGN" --summary-only | tee coverage-summary.txt

      # Extract the total line-coverage % (JSON is stable to parse vs the table)
      # and enforce the Phase 1b floor.
      - name: enforce coverage floor (88% — Phase 1b)
        run: |
          set -euo pipefail
          PCT="$(python3 -c "import json; d=json.load(open('coverage.json')); print(f\"{d['data'][0]['totals']['lines']['percent']:.2f}\")")"
          echo "Total line coverage: ${PCT}%"
          {
            echo "## Coverage (floor 88%)"
            echo ""
            echo "**Total line coverage: ${PCT}%**"
            echo ""
            echo "Posture: measure -> ratchet -> gate. Floor is active (Phase 1b); a drop below it fails this check."
            echo ""
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # PHASE 1b — floor ACTIVE. Baseline measured 88.82% line coverage (2026-07-17,
          # PR #187); floor set ~0.8% below at 88. Deterministic (same tests => same %),
          # so this is a hard ratchet, not flaky. Ratchet it UP as coverage improves.
          # (This check is not yet required at branch-protection — Phase 1c promotes it
          # once it has run green on main a few times.)
          FLOOR=88
          if awk "BEGIN{exit !(${PCT} < ${FLOOR})}"; then
            echo "::error::coverage ${PCT}% dropped below the floor of ${FLOOR}% — add tests for the new code, or raise the case with the reviewer"
            exit 1
          fi
          echo "coverage ${PCT}% >= floor ${FLOOR}% — OK"

      - name: upload coverage artifacts (lcov + json + summary)
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage.json
            coverage-summary.txt
          if-no-files-found: error
