# E2E evidence — the REAL `clw` BINARY, driven as a user against PROD, with per-step
# evidence published as an artifact.
#
# This is the BINARY-as-user complement to live-journeys.yml. live-journeys drives the
# clw *library* APIs (clw-conformance, `--features live`); THIS lane drives the actual
# `clw` binary (argv + env) via the `clw-e2e` evidence runner and uploads the analyzable
# report (evidence.md + evidence.html) — the deliverable a human reads to analyze
# behaviour + security per step. "Não pode ser por outro caminho": no library call, the
# binary is the only entry point.
#
# Credential model — one secret set per persona (REUSES the live-journeys CI secrets where
# they overlap; provision once, both lanes light up):
#   CLW_CI_TOKEN / CLW_CI_TENANT / CLW_CI_ENDPOINT   primary identity → Marina (solo),
#                                                     Dana (security), Ravi (automation). REQUIRED.
#   CLW_CI_TOKEN_B                                    a 2nd identity (same tenant) → the TEAM
#                                                     persona (Priya+Sam). REQUIRED by this lane.
#   CLW_CI_ERASE_TENANT / CLW_CI_ERASE_TOKEN          a dedicated throwaway tenant → the
#                                                     OFFBOARDING persona (Omar). REQUIRED by this lane; the
#                                                     erase is REAL, so it must be a throwaway ≠
#                                                     the primary tenant (the harness fences both).
#   CLW_CI_QUOTA_TENANT / CLW_CI_QUOTA_TOKEN          a dedicated $-ceilinged tenant → the QUOTA
#                                                     persona (Nadia → real 402). REQUIRED by this lane; also
#                                                     fenced ≠ primary (a snapshot here is meant to
#                                                     hit the budget wall — never the primary).
#
# This workflow enables both CLW_E2E_REQUIRE_PROD=1 and CLW_E2E_REQUIRE_ALL=1: every skipped
# persona is a HARD failure after its evidence is recorded. `REQUIRE_PROD` retains its narrower
# primary-only behavior for non-strict callers; `REQUIRE_ALL` is what makes this lane complete.
#
# The report artifact is uploaded ALWAYS (even on a red run) — a failed run is exactly
# when the evidence matters most.

name: e2e-evidence

on:
  # MANUAL ONLY — no schedule. This lane exercises prod + burns CI minutes, so it runs
  # only when a human clicks "Run workflow" (or via `gh workflow run e2e-evidence.yml`).
  # The daily prod watch is already covered by the conformance/metered/deadman canaries;
  # this is the on-demand "give me a fresh per-step evidence report" button.
  workflow_dispatch:

# Minimum scope. Declaring ANY block resets every unnamed scope to `none`, so this
# narrows GITHUB_TOKEN from the repository default (read on every scope) to read on
# `contents` alone — the floor required by actions/checkout@v4. The job talks to PROD
# with the per-persona service PATs (CLW_CI_*), not with GITHUB_TOKEN, and makes no
# `gh` call and writes no check.
#
# The evidence upload deliberately gets NO elevation: actions/upload-artifact@v4
# writes through the per-run ACTIONS_RUNTIME_TOKEN (the artifact service), not
# through GITHUB_TOKEN, so it needs no `actions:` scope. Granting `actions: write`
# here would be scope this lane never spends. (Read-and-verified, not inferred from
# a green run: an unexercised permission is invisible to a run.)
permissions:
  contents: read

concurrency:
  group: e2e-evidence
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  evidence:
    name: e2e evidence (Linux binary, real binary as user)
    # Standard GitHub-hosted Ubuntu; no CoreLink runner or local Mac is required.
    # This manual live-evidence job remains Linux-only; no native Windows
    # evidence is claimed by changing the execution provider.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: provision the workspace-pinned toolchain (rust-toolchain.toml)
        run: rustup show

      # Build the clw binary (the harness drives it via argv+env) AND the evidence runner.
      - name: build clw + the e2e evidence runner
        run: cargo build -p clw-cli -p clw-e2e-evidence --bins

      - name: run the evidence journeys against prod (REQUIRE_ALL=1)
        env:
          # Map the CI service identity onto the harness env names (same wiring +
          # SAME secrets as the live-journeys lane).
          CLW_TOKEN: ${{ secrets.CLW_CI_TOKEN }}
          CLW_TENANT: ${{ secrets.CLW_CI_TENANT }}
          CLW_ENDPOINT: ${{ secrets.CLW_CI_ENDPOINT }}
          # Required in this strict lane: the runner treats EVERY skip, including a
          # team/offboarding/quota persona missing its dedicated input, as a failure.
          CLW_TOKEN_B: ${{ secrets.CLW_CI_TOKEN_B }}
          CLW_E2E_ERASE_TENANT: ${{ secrets.CLW_CI_ERASE_TENANT }}
          CLW_E2E_ERASE_TOKEN: ${{ secrets.CLW_CI_ERASE_TOKEN }}
          CLW_E2E_QUOTA_TENANT: ${{ secrets.CLW_CI_QUOTA_TENANT }}
          CLW_E2E_QUOTA_TOKEN: ${{ secrets.CLW_CI_QUOTA_TOKEN }}
          # Null the ambient env-0 cred trio: on a `corelink` box the fabric injects a
          # single-use cred ticket bound to the box's SPAWN tenant; the driven clw child
          # would otherwise take the credential-broker path instead of the per-persona
          # CLW_TOKEN. Nulling keeps each persona on its explicit identity.
          CLW_CRED_TICKET: ""
          CLW_LEASE_ID: ""
          CLW_FABRIC_ENDPOINT: ""
          # Keep normal prod semantics available to ad-hoc callers, while this CI lane
          # deliberately requires the complete persona matrix and rejects any skip.
          CLW_E2E_REQUIRE_PROD: "1"
          CLW_E2E_REQUIRE_ALL: "1"
          CLW_E2E_OUT: e2e-reports
        run: |
          set -euo pipefail
          if [ -z "${CLW_TOKEN:-}" ]; then
            echo "::error::CLW_CI_TOKEN absent — the strict e2e-evidence lane requires the primary PAT (REQUIRE_PROD=1 and REQUIRE_ALL=1). Provision the CI service PAT secret."
            exit 1
          fi
          [ -z "${CLW_TOKEN_B:-}" ] && echo "::warning::CLW_CI_TOKEN_B absent — REQUIRE_ALL=1 will fail after recording the TEAM skip."
          [ -z "${CLW_E2E_ERASE_TENANT:-}" ] && echo "::warning::CLW_CI_ERASE_TENANT absent — REQUIRE_ALL=1 will fail after recording the OFFBOARDING skip."
          [ -z "${CLW_E2E_ERASE_TOKEN:-}" ] && echo "::warning::CLW_CI_ERASE_TOKEN absent — REQUIRE_ALL=1 will fail after recording the OFFBOARDING skip."
          [ -z "${CLW_E2E_QUOTA_TENANT:-}" ] && echo "::warning::CLW_CI_QUOTA_TENANT absent — REQUIRE_ALL=1 will fail after recording the QUOTA skip."
          [ -z "${CLW_E2E_QUOTA_TOKEN:-}" ] && echo "::warning::CLW_CI_QUOTA_TOKEN absent — REQUIRE_ALL=1 will fail after recording the QUOTA skip."
          echo "Driving the real clw binary as a user against prod; publishing per-step evidence."
          # The evidence runner locates the binary next to itself; point it explicitly.
          CLW_E2E_BIN="$(pwd)/target/debug/clw" "./target/debug/clw-e2e"

      - name: upload the evidence report (always — a red run is when it matters most)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-report-linux
          path: e2e-reports/
          if-no-files-found: warn
          retention-days: 30
