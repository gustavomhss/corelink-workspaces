# Live-journeys suite — a REAL USER, in PROD, exercised by feature/journey.
#
# `crates/clw-conformance/tests/live_journeys.rs` drives the real clw APIs against
# live prod for the journeys that ONLY a real backend proves: cross-snapshot dedup
# counters, a warming cache across real fetches, and a shared tenant used by TWO
# identities (a "team").
#
# Relationship to conformance-canary.yml: the daily canary already runs the WHOLE
# `cargo test -p clw-conformance --features live` suite, so the single-identity
# journeys (dedup, warm-cache) run there too. THIS lane exists to additionally wire
# the SECOND identity (CLW_TOKEN_B) so the team-share journey actually executes in
# CI — the canary doesn't provide a second PAT, so team-share soft-skips there.
#
# Like the canary, this sets CLW_CONFORMANCE_REQUIRE=1 so a skip (missing primary
# cred / an unavailable endpoint) FAILS loudly. The team journey soft-skips (never
# a require-fail) if CLW_TOKEN_B is absent, so the lane still passes with just the
# primary PAT.

name: live-journeys

on:
  # Weekly — the single-identity journeys are already covered daily by the canary;
  # this cadence is for the two-identity team journey + on-demand runs.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: live-journeys
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  journeys:
    name: live journeys (prod, real user)
    # Runs on `corelink` — CoreLink's OWN ephemeral CF-Firecracker runner fabric (zero
    # hosted-Actions spend; org mandate "self-hosted tudo ou não roda"). This is a network
    # test against live prod; the box is an ephemeral microVM (NOT the single Mac), so
    # there is no shared-box blind spot, and if the fabric is down the job fails-to-start =
    # RED, the correct signal.
    runs-on: corelink
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # The `corelink` image ships rustup; `rustup show` reads rust-toolchain.toml and
      # provisions the pinned channel (1.91.1) on first use. Do NOT `rustup default` — the
      # pin in the file is authoritative and the box is an ephemeral microVM (no shared-$HOME
      # hazard), matching the corelink-server self-hosted lanes.
      - name: provision the workspace-pinned toolchain (rust-toolchain.toml)
        run: rustup show

      # The destructive erase/prune journeys spawn the real `clw` binary; build it so
      # `clw_binary()` can locate target/debug/clw (else those journeys soft-skip).
      - name: build the clw binary (for the destructive journeys)
        run: cargo build -p clw-cli

      - name: live-journeys suite (clw-conformance --features live, REQUIRE=1)
        env:
          # The suite reads CLW_TOKEN/CLW_TENANT/CLW_ENDPOINT — map the CI service
          # identity onto those names (same wiring as the conformance canary).
          CLW_TOKEN: ${{ secrets.CLW_CI_TOKEN }}
          CLW_TENANT: ${{ secrets.CLW_CI_TENANT }}
          CLW_ENDPOINT: ${{ secrets.CLW_CI_ENDPOINT }}
          # SECOND identity on the SAME tenant for the team-share journey. Optional:
          # when absent, only the team journey soft-skips (the lane still passes).
          CLW_TOKEN_B: ${{ secrets.CLW_CI_TOKEN_B }}
          # Extra-infra journeys, ALL optional (soft-skip when absent, lane still
          # passes): the metered-quota 402 probe, the real-fabric cred-ticket, and the
          # DESTRUCTIVE erase/prune throwaway tenant. Wire these to exercise them.
          CLW_PROBE_TENANT: ${{ secrets.CLW_CI_PROBE_TENANT }}
          CLW_PROBE_TOKEN: ${{ secrets.CLW_CI_PROBE_TOKEN }}
          CLW_LIVE_ERASE_TENANT: ${{ secrets.CLW_CI_ERASE_TENANT }}
          CLW_LIVE_ERASE_TOKEN: ${{ secrets.CLW_CI_ERASE_TOKEN }}
          # Null the ambient cred trio. On a `corelink` box spawned by the runner fabric,
          # env-0 injects a single-use cred ticket (CLW_CRED_TICKET+CLW_LEASE_ID+
          # CLW_FABRIC_ENDPOINT) bound to the BOX's SPAWN tenant (dogfood) — a DIFFERENT
          # tenant than CLW_TENANT here. The `cred_ticket_redeems_*` journey would redeem
          # it and hit /v1/ac/<CLW_TENANT> with a dogfood-bound PAT → a correct cross-tenant
          # 403 (tenant isolation), a false red. Nulling makes that journey soft-skip (as it
          # did on the old hosted lane); the redeem path is exercised by real runner E2E.
          CLW_CRED_TICKET: ""
          CLW_LEASE_ID: ""
          CLW_FABRIC_ENDPOINT: ""
          # REQUIRE=1: a skip of the PRIMARY-cred journeys is a hard failure. The
          # extra-infra journeys use `soft_skip` (NOT skip_or_fail), so they never
          # trip REQUIRE — the lane is green with just the primary PAT.
          CLW_CONFORMANCE_REQUIRE: "1"
        run: |
          set -euo pipefail
          if [ -z "${CLW_TOKEN:-}" ]; then
            echo "::error::CLW_CI_TOKEN absent — the live-journeys lane REQUIRES the primary PAT (CLW_CONFORMANCE_REQUIRE=1). Provision the CI service PAT secret."
            exit 1
          fi
          [ -z "${CLW_TOKEN_B:-}" ] && echo "::warning::CLW_CI_TOKEN_B absent — team-share journey soft-skips."
          [ -z "${CLW_LIVE_ERASE_TENANT:-}" ] && echo "::warning::CLW_CI_ERASE_TENANT absent — destructive erase/prune journeys soft-skip (provision a throwaway tenant to exercise them)."
          echo "Running live journeys against prod (REQUIRE=1 — a primary-cred skip is a hard failure; extra-infra journeys soft-skip)."
          cargo test -p clw-conformance --features live --test live_journeys
