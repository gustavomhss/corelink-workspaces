# Live-conformance canary — SCHEDULED continuous validation of SHIPPED behavior
# against LIVE prod. Closes the gap between point-in-time release-time conformance
# (release.yml's pre-tag gate) and "is prod + the shipped clw contract still healthy
# TODAY". A failure here = prod regressed or the shipped contract drifted -> visible
# in the Actions tab.
#
# This REUSES, verbatim, two proven pieces:
#   * release.yml's live-conformance cred wiring: the CI service-identity secrets
#     (CLW_CI_TOKEN / CLW_CI_TENANT / CLW_CI_ENDPOINT) mapped onto the names the
#     suite actually reads (CLW_TOKEN / CLW_TENANT / CLW_ENDPOINT), plus the
#     `cargo test -p clw-conformance --features live` invocation.
#   * ci.yml's self-hosted "put pinned Rust toolchain on PATH" step (the rustup
#     proxy can be nuked on the shared self-hosted Mac).
#
# DIFFERENCE from release.yml's gate: there the missing-PAT SKIP is an intentional
# dry-run no-op (green). HERE the canary always sets CLW_CONFORMANCE_REQUIRE=1, so a
# SKIP (missing creds OR an unavailable endpoint) FAILS the canary LOUDLY rather than
# green-passing — a silent canary is worse than no canary.

name: conformance-canary

on:
  # Daily — catch a prod/contract regression within ~24h, not at the next release.
  schedule:
    - cron: "0 13 * * *"
  # Manual trigger for on-demand validation.
  workflow_dispatch:

# Minimum scope. Declaring ANY block resets every unnamed scope to `none`, so this
# narrows GITHUB_TOKEN from the repository default (read on every scope) to read on
# `contents` alone — the floor required by actions/checkout@v4. The single job here
# authenticates to PROD with a service PAT (CLW_CI_*), NOT with GITHUB_TOKEN: it
# makes no `gh` call, uploads no artifact, writes no check. So no elevation is
# granted. Note for the reader: canary-deadman.yml, which WATCHES this workflow's
# run history via `gh run list`, is the lane that needs `actions: read` — that
# permission belongs there, not here.
permissions:
  contents: read

# Never run two canaries at once.
concurrency:
  group: conformance-canary
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  canary:
    name: live conformance canary (prod)
    # Runs on `corelink` — CoreLink's OWN ephemeral CF-Firecracker runner fabric
    # (zero hosted-Actions spend; org mandate "self-hosted tudo ou não roda"). The
    # earlier "must be hosted so it doesn't depend on the single Mac" rationale no
    # longer holds: `corelink` boxes are ephemeral microVMs, NOT the single Mac, so
    # there is no shared-box blind spot. The canary is a network test against live
    # prod; if the corelink fabric is itself down the job fails-to-start = RED, which
    # is the correct signal (and hosted already produced no useful red under the
    # GitHub-Actions billing block — a 2s no-runner failure).
    runs-on: corelink
    timeout-minutes: 20
    env:
      # CI service identity for the live conformance suite (same secrets as
      # release.yml's conformance gate). Declared here for visibility; the actual
      # name-mapping the suite reads happens on the test step below.
      CLW_CI_TOKEN: ${{ secrets.CLW_CI_TOKEN }}
      CLW_CI_TENANT: ${{ secrets.CLW_CI_TENANT }}
      CLW_CI_ENDPOINT: ${{ secrets.CLW_CI_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      # The `corelink` image ships rustup; `rustup show` reads rust-toolchain.toml
      # and provisions the pinned channel (1.91.1 + rustfmt/clippy) on first use.
      # Do NOT `rustup default`/`toolchain install` here: the pin in the file is
      # authoritative and rustup honours it over any global default — matching the
      # corelink-server self-hosted lanes. The box is an ephemeral microVM, so there
      # is no shared-$HOME hazard, but keeping the pin as the single source of truth
      # avoids a per-run global mutation for nothing.
      - name: provision the workspace-pinned toolchain (rust-toolchain.toml)
        run: rustup show

      # The canary REQUIRES the live cases to actually run: a missing PAT (or an
      # unreachable/unavailable endpoint) must FAIL loudly, never green-skip.
      - name: live conformance suite (clw-conformance --features live, REQUIRE=1)
        env:
          # CRITICAL: the suite reads CLW_TOKEN/CLW_TENANT/CLW_ENDPOINT
          # (clw-conformance/tests/live_conformance.rs::try_config), NOT the CLW_CI_*
          # names. Map the CI service-identity secrets onto the names the suite
          # actually reads — without this mapping every live case skips even when the
          # PAT is provisioned.
          CLW_TOKEN: ${{ secrets.CLW_CI_TOKEN }}
          CLW_TENANT: ${{ secrets.CLW_CI_TENANT }}
          CLW_ENDPOINT: ${{ secrets.CLW_CI_ENDPOINT }}
          # This canary is a TOKEN-identity conformance check (CLW_CI_TOKEN). Now that
          # it runs on a `corelink` box spawned by the runner fabric, env-0 injects an
          # ambient single-use cred ticket (CLW_CRED_TICKET+CLW_LEASE_ID+
          # CLW_FABRIC_ENDPOINT) bound to the BOX's SPAWN tenant (dogfood), which is a
          # DIFFERENT tenant than CLW_CI_TENANT. The C2c `cred_ticket_redeems_*` journey
          # would then redeem that ambient ticket and hit /v1/ac/<CLW_CI_TENANT> with a
          # dogfood-bound PAT → a correct cross-tenant 403 (tenant isolation), a false
          # canary red. Null the trio so that journey soft-skips here (as it did on the
          # old hosted lane); the redeem path is exercised by real runner E2E, not this
          # token-identity canary.
          CLW_CRED_TICKET: ""
          CLW_LEASE_ID: ""
          CLW_FABRIC_ENDPOINT: ""
          # REQUIRE=1 turns a skip (missing cred OR a 405/501 unavailable endpoint)
          # into a hard failure, so a red/unreachable prod fails the canary.
          CLW_CONFORMANCE_REQUIRE: "1"
        run: |
          set -euo pipefail
          if [ -z "${CLW_TOKEN:-}" ]; then
            echo "::error::CLW_CI_TOKEN absent — the canary REQUIRES live conformance to run (CLW_CONFORMANCE_REQUIRE=1). A missing PAT must fail the canary, not green-skip. Provision the CI service PAT secret."
            exit 1
          fi
          echo "Running live conformance against prod (REQUIRE=1 — a skip is a hard failure)."
          cargo test -p clw-conformance --features live
