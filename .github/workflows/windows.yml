# Windows binary smoke on a standard GitHub-hosted Ubuntu VM.
#
# What this IS: a cheap regression smoke that the SHIPPED windows-gnu `clw.exe`
# actually EXECUTES and dispatches commands. It builds the binary with mingw on
# Ubuntu Linux and runs it under Wine — catching a build/link that compiles
# but won't run, or a broken command dispatch, at $0 hosted cost. This replaces the
# old `windows-latest` lane, which under the GitHub-Actions billing block never
# started (steps=0, no runner) and therefore tested NOTHING.
#
# What this is NOT — and MUST NOT be mistaken for: a full Windows-runtime gate.
# Wine's fidelity for the very things a Windows lane exists to check — NTFS
# alternate-data-stream rejection, drive-letter/backslash edge cases, the symlink
# copy-fallback — is partial/uncertain, so a GREEN here does NOT prove those. It was
# measured (PoC on corelink 2026-08-12): `wine clw.exe` runs and dispatches fine,
# and the pure-logic unit tests pass under Wine, but clw-run's command-execution +
# FS-semantics tests and the assert_cmd-based e2e harness do NOT run trustworthily
# under Wine (subprocess/path-translation limits). Full-fidelity Windows-runtime
# coverage needs a separate native Windows test lane. This migration preserves
# the existing Wine smoke; it does not upgrade Wine results to native evidence.
#
# The shipped Windows BINARY is separately cross-built + released via zig on the Mac
# (release.yml) — independent of this lane.

name: windows

on:
  push:
    branches: [main]
  pull_request:
    paths: [".github/workflows/windows.yml", "crates/**", "Cargo.*"]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TGT: x86_64-pc-windows-gnu
  CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
  WINEDEBUG: "-all"
  # CI_CREDENTIAL_NULL_GUARD: workflow-env
  # This lane builds and executes a PR-controlled Windows binary under Wine, so
  # the runner fabric's broker credential trio must be empty first.
  CLW_CRED_TICKET: ""
  CLW_LEASE_ID: ""
  CLW_FABRIC_ENDPOINT: ""

jobs:
  smoke:
    name: windows binary smoke (mingw build, wine run)
    # Standard GitHub-hosted Ubuntu; no CoreLink runner or local Mac is required.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: assert PR broker credentials are absent
        if: github.event_name == 'pull_request' || startsWith(github.event_name, 'pull_request_')
        shell: bash
        run: |
          set -euo pipefail
          for credential in CLW_CRED_TICKET CLW_LEASE_ID CLW_FABRIC_ENDPOINT; do
            [ -z "${!credential:-}" ] || {
              echo "::error::PR broker credential must be empty: ${credential}"
              exit 1
            }
          done
      - uses: actions/checkout@v4

      - name: install wine + mingw on Ubuntu
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # `wine` (the metapackage) provides the PATH wrapper that dispatches to the
          # 64-bit loader for x64 exes; `gcc-mingw-w64-x86-64` is the windows-gnu linker.
          sudo apt-get install -y wine gcc-mingw-w64-x86-64
          command -v wine >/dev/null || { echo "::error::wine not on PATH after install"; exit 1; }
          command -v x86_64-w64-mingw32-gcc >/dev/null || { echo "::error::mingw not on PATH after install"; exit 1; }
          wine --version

      - name: pinned toolchain + windows-gnu target
        run: |
          set -euo pipefail
          rustup show
          rustup target add "$TGT"

      - name: build the shipped-shape clw.exe (windows-gnu, mingw linker)
        run: cargo build --release --locked -p clw-cli --target "$TGT"

      - name: smoke — the real clw.exe runs + dispatches under wine
        run: |
          set -euo pipefail
          BIN="target/${TGT}/release/clw.exe"
          test -f "$BIN"
          # --version: proves the mingw-built windows-gnu binary actually executes
          # (not just links). Assert it prints a name + a digit.
          OUT="$(wine "$BIN" --version)"
          echo "clw.exe --version => $OUT"
          echo "$OUT" | grep -q "clw" || { echo "::error::clw.exe --version did not print a clw version"; exit 1; }
          # doctor: exercises offline command dispatch (arg parsing + config resolution
          # + the --json path) on the Windows binary.
          CLW_TENANT=smoke CLW_TOKEN=smoke-tok wine "$BIN" --json doctor >/dev/null
          echo "clw.exe --json doctor dispatched OK"
          echo "WINDOWS-SMOKE-OK (dispatch only; full NTFS/drive/ADS fidelity needs a real Windows runner)"

      # M17 / WP-28. The Windows symlink copy-fallback must refuse a target
      # directory that contains the link itself (`d/up -> ..`), which would
      # otherwise recurse until MAX_PATH. The DECISION lives in a plain,
      # target-independent predicate (clw-hydrate's `path_containment`) precisely
      # so it is testable; this step runs that predicate's table on the real
      # windows-gnu binary, under wine.
      #
      # SCOPE — read before trusting this step:
      #   * PROVEN here: that the LEXICAL layer (`path_contains` and its
      #     normalisation) computes the same answers when compiled for
      #     windows-gnu and executed on that ABI. Also that clw-hydrate's
      #     `#[cfg(windows)]` test code LINKS (the PR gate only type-checks it).
      #   * NOT proven here, and do not read it as proven: NTFS behaviour. These
      #     tests are pure computation over string literals — they assert OUR
      #     model of Win32 folding, on wine, not what a real NTFS does.
      #   * NOT proven here: the materializer, or layer 2 (`canonicalize`).
      #     Driving a real `clw.exe hydrate` needs a live CAS/AC backend, which
      #     this offline job has not got; the `#[cfg(windows)]` materializer test
      #     (`self_referential_symlinks_rejected_on_windows`, the only tokio one)
      #     and every `canonical_guard_*` test are tempdir/FS-semantics — exactly the
      #     class this file's header records as NOT running trustworthily under
      #     wine, and two of them need SeCreateSymbolicLinkPrivilege. They are
      #     deliberately NOT filtered in, rather than run with
      #     `continue-on-error`, which would be a gate in name only. They run for
      #     real only in a separately validated native Windows test lane.
      #
      # The `lexical_` prefix is what keeps that separation honest: it selects
      # the pure-computation tests and nothing else. An earlier revision filtered
      # on `path_containment`, which dragged in all seven filesystem tests and
      # made this step fail with exit 101 on every run.
      - name: M17 — the lexical predicate runs on the windows binary
        run: |
          set -euo pipefail
          SRC=crates/clw-hydrate/src/path_containment.rs

          # ANTI-VACUITY. Every way of NOT getting something to check is a NAMED
          # failure, never a skip and never a zero. The expected test count is
          # derived from the SOURCE the step is checking, so this gate holds no
          # second copy of the list: renaming a `lexical_` test out of the filter
          # turns the lane red instead of silently shrinking what runs. (The
          # previous revision asserted only ">= 1 passed", under which the whole
          # table could stop running and the step would still print OK.)
          test -f "$SRC" || { echo "::error::$SRC not found — this gate cannot read its own oracle"; exit 1; }
          EXPECTED="$(grep -cE '^[[:space:]]+fn lexical_' "$SRC" || true)"
          if [ "${EXPECTED:-0}" -eq 0 ]; then
            echo "::error::found ZERO 'fn lexical_' tests in $SRC. Either they were all renamed, or this"
            echo "::error::gate's reading of the file broke. A gate that checks nothing must not print OK."
            exit 1
          fi
          echo "oracle: $SRC declares $EXPECTED lexical_ test(s)"

          cargo test -p clw-hydrate --locked --target "$TGT" --no-run 2>&1 | tee /tmp/build.log
          BIN="$(grep -oE 'target/[^ )]*clw_hydrate-[0-9a-f]+\.exe' /tmp/build.log | head -1)"
          test -n "$BIN" || { echo "::error::could not find the clw_hydrate test .exe in the build log"; exit 1; }
          test -f "$BIN" || { echo "::error::build log named $BIN but it does not exist"; exit 1; }
          echo "running $BIN under wine (filter: lexical_)"
          # Capture stdout AND stderr, and NEVER let the failure of this command
          # abort the step before the output is printed: under `set -e` a bare
          # `OUT="$(...)"` exits on a non-zero rc, so a panicking binary produced
          # a red step with ZERO diagnostics. Print first, assert second.
          set +e
          OUT="$(wine "$BIN" lexical_ --test-threads=1 2>&1)"
          RC=$?
          set -e
          echo "$OUT"
          echo "wine exit code: $RC"
          [ "$RC" -eq 0 ] \
            || { echo "::error::clw_hydrate.exe exited $RC under wine (see output above)"; exit 1; }
          # Assert EXACTLY the number the source declares, with zero failures.
          # Adding a `lexical_` test raises both sides together, so the lane does
          # not go red for growth — but a test dropping OUT of the filter (renamed,
          # cfg'd away, #[ignore]d) no longer shrinks the run silently.
          echo "$OUT" | grep -qE "^test result: ok\. ${EXPECTED} passed; 0 failed" || {
            echo "::error::expected ${EXPECTED} passing lexical_ tests under wine (the count $SRC declares),"
            echo "::error::but the run above did not report that. See the output for what actually ran."
            exit 1
          }
          echo "M17-LEXICAL-OK on windows-gnu: ${EXPECTED}/${EXPECTED} lexical tests"
          echo "  (layer 2 + materializer are NOT covered here — see the scope note above)"
