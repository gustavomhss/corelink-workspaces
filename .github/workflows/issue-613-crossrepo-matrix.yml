name: Issue 613 cross-repository Action + CLI matrix

on:
  workflow_dispatch:
    inputs:
      workspaces_sha:
        description: Exact workspaces candidate commit (40 hex characters)
        type: string
        required: true
      runners_sha:
        description: Exact public HuGR-dev/corelink-runners commit (40 hex characters)
        type: string
        required: true
        default: 9e85d73d9c0bd83c265678f204161fe3d6adb973

permissions:
  contents: read

jobs:
  hosted-matrix:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        child_exit: [0, 7, 125]
    env:
      RUNNERS_SHA: ${{ inputs.runners_sha }}
      WORKSPACES_SHA: ${{ inputs.workspaces_sha }}
      WORKSPACES_REPOSITORY_ID: '1259579816'
      RUNNERS_REPOSITORY_ID: '1266754321'
      CLW_TENANT: issue-613-test
      CLW_TOKEN: issue-613-local-only
      CLW_CACHE_DIR: ${{ github.workspace }}/.issue-613-clw-cache
      CHILD_EXIT: ${{ matrix.child_exit }}

    defaults:
      run:
        working-directory: workspaces

    steps:
      - name: Checkout private workspaces at the authored SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HuGR-Labs/corelink-workspaces
          ref: ${{ inputs.workspaces_sha }}
          token: ${{ github.token }}
          persist-credentials: false
          path: workspaces

      - name: Checkout public runners at the requested exact SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HuGR-dev/corelink-runners
          ref: ${{ inputs.runners_sha }}
          token: ${{ github.token }}
          persist-credentials: false
          path: runners

      - name: Build the real clw CLI
        run: cargo build --locked --manifest-path Cargo.toml -p clw-cli

      - name: Add the compiled CLI to PATH
        run: echo "$GITHUB_WORKSPACE/workspaces/target/debug" >> "$GITHUB_PATH"

      - name: Set isolated case output path
        run: echo "EFFECT_LOG=$RUNNER_TEMP/issue-613-effects-$CHILD_EXIT" >> "$GITHUB_ENV"

      - name: Start loopback only CAS and AC double
        run: |
          port_file="$RUNNER_TEMP/issue-613-local-ac.port"
          request_log="$RUNNER_TEMP/issue-613-local-ac.requests"
          nohup python3 scripts/i613_local_ac_server.py \
            --port-file "$port_file" --request-log "$request_log" \
            >/dev/null 2>&1 </dev/null &
          echo "$!" > "$RUNNER_TEMP/issue-613-local-ac.pid"
          for _ in $(seq 1 50); do [ -s "$port_file" ] && break; sleep 0.1; done
          test -s "$port_file"
          port="$(cat "$port_file")"
          case "$port" in *[!0-9]*|'') exit 1 ;; esac
          echo "CLW_ENDPOINT=http://127.0.0.1:$port" >> "$GITHUB_ENV"
          echo "I613_REQUEST_LOG=$request_log" >> "$GITHUB_ENV"

      - name: Action + real CLI, child exit ${{ matrix.child_exit }} (first)
        id: action_first
        continue-on-error: true
        uses: ./runners/actions/corelink-memoize
        with:
          inputs: Cargo.toml
          env: CHILD_EXIT
          run: |
            printf 'x\n' >> "$EFFECT_LOG"
            exit "$CHILD_EXIT"
        env:
          CLW_RUN_STATE_FILE: ${{ runner.temp }}/issue-613-state-${{ matrix.child_exit }}-first

      - name: Action + real CLI, child exit ${{ matrix.child_exit }} (repeat)
        id: action_repeat
        continue-on-error: true
        uses: ./runners/actions/corelink-memoize
        with:
          inputs: Cargo.toml
          env: CHILD_EXIT
          run: |
            printf 'x\n' >> "$EFFECT_LOG"
            exit "$CHILD_EXIT"
        env:
          CLW_RUN_STATE_FILE: ${{ runner.temp }}/issue-613-state-${{ matrix.child_exit }}-repeat

      - name: Proven pre-execution failure falls back once
        if: matrix.child_exit == 0
        id: action_preexec_fallback
        continue-on-error: true
        uses: ./runners/actions/corelink-memoize
        with:
          inputs: Cargo.toml
          env: CHILD_EXIT
          run: |
            printf 'x\n' >> "$RUNNER_TEMP/issue-613-effects-fallback"
            exit 0
        env:
          CLW_ENDPOINT: http://127.0.0.1:1
          CLW_RUN_STATE_FILE: ${{ runner.temp }}/issue-613-state-fallback

      - name: Verify matrix result and emit bound receipt
        if: always()
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SERVER_URL: ${{ github.server_url }}
          MATRIX_EXIT: ${{ matrix.child_exit }}
          OUTCOME_FIRST: ${{ steps.action_first.outcome }}
          OUTCOME_REPEAT: ${{ steps.action_repeat.outcome }}
          OUTCOME_FALLBACK: ${{ steps.action_preexec_fallback.outcome }}
        run: |
          receipt="$RUNNER_TEMP/issue-613-receipt-${MATRIX_EXIT}.json"
          python3 scripts/verify_i613_crossrepo_matrix.py \
            --runtime --receipt "$receipt" || matrix_status=$?
          [ ! -f "$receipt" ] || cat "$receipt" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${matrix_status:-}" ]; then exit "$matrix_status"; fi

      - name: Stop loopback service
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/issue-613-local-ac.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/issue-613-local-ac.pid")" 2>/dev/null || true
          fi
