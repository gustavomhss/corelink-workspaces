# Release pipeline — clw signed, cross-platform distribution (WP M3 release scaffold).
#
# STATUS: IMPLEMENTED, secret-gated. The signing (macOS/Windows/Linux), signed-
# checksum, and publish steps are now fully implemented against the documented
# vendor toolchains. Each is guarded by secret-presence: ABSENT secret -> the step
# no-ops cleanly (dry-run, green); PRESENT secret -> the step runs for real. So the
# whole pipeline is dry-runnable today and goes live end-to-end the moment the owner
# provisions the secrets (docs/DISTRIBUTION.md + docs/go-live/LAUNCH-CHECKLIST.md).
# CAVEAT (owner-authorized): the signing/publish bodies are written to spec but
# cannot be exercised end-to-end until those owner-gated accounts/secrets exist
# (there is no signing infra to test against pre-provision) — the first real run is
# the owner's provisioning run. Every owner-gated value is still flagged TODO(OWNER).
#
# Pipeline shape (four serial stages, dependent jobs):
#   preflight  -> build (5-target matrix, sign folded in) -> publish (checksum + upload)
#
# Constraints (from docs/go-live/WP-BRIEFS.md M2.3 / M2.5):
#   * Proprietary: the download surface is NOT a public GitHub Release.
#   * Signed: macOS Developer ID + notarize; Windows cloud/HSM Authenticode;
#     Linux minisign (sigstore as documented alternative).
#   * Cross-platform, 5 locked targets, built with ZERO GitHub-hosted spend
#     (org mandate "self-hosted tudo ou não roda"), mirroring the PROVEN
#     corelink-server CLI release (release-cli.yml): ONE self-hosted Mac runner
#     (`corelink-builder`) builds every target via `cargo-zigbuild` —
#       aarch64-apple-darwin       -> native `cargo build` (system linker)
#       x86_64-apple-darwin        -> native `cargo build` (cross on Apple Silicon)
#       x86_64-unknown-linux-gnu   -> `cargo zigbuild` (zig libc+linker)
#       aarch64-unknown-linux-gnu  -> `cargo zigbuild` (zig libc+linker)
#       x86_64-pc-windows-gnu      -> `cargo zigbuild` (zig, gnu ABI)
#   * Build host: the self-hosted Mac fleet (`corelink-builder`, $0 CF). zig
#     supplies the libc headers + linker for the Linux + windows-gnu cross
#     targets; the darwin targets build NATIVELY (zigcc has an upstream
#     iconv/charset bug for darwin-on-darwin). A real macOS host is required for
#     the Developer-ID codesign + notarization anyway, so folding every leg onto
#     it costs nothing extra. Rust comes from the pre-installed HOST toolchain via
#     `scripts/ci-use-host-toolchain.sh` (NEVER `rustup install`/`default` on the
#     shared-$HOME Mac fleet — the os-error-2 crash + reproducibility-pin drift).
#     The non-build jobs (preflight, conformance, sbom, publish) run on `corelink`
#     (ephemeral CF-Firecracker Linux). Windows is gnu, NOT msvc.

name: release

# Tag-triggered only. The brief specifies `tags: ['v*']` for this scaffold, so we
# trigger broadly here and let the preflight GUARD job reject non-semver and
# version-mismatched tags. That keeps the trigger simple while still failing fast.
on:
  push:
    tags:
      - 'v*'

# Never run two releases for the same tag concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Pinned toolchain — must match rust-toolchain.toml. Installed via the standard
  # preinstalled rustup on each ephemeral GitHub-hosted runner (`rustup show`
  # materializes the rust-toolchain.toml pin).
  RUST_TOOLCHAIN: "1.91.1"

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1 — PREFLIGHT / GUARD
  # Validates the tag and runs the hard pre-tag gates. Runs on a hosted runner.
  # ---------------------------------------------------------------------------
  preflight:
    name: preflight (guard + gates)
    # `corelink` — ephemeral CF-Firecracker Linux (zero hosted spend). rustup +
    # the pinned toolchain are baked; `sudo apt-get` (mingw for the windows-gnu
    # cross-check) works on the box.
    runs-on: corelink
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      # rc-vs-real classification — computed ONCE here so downstream jobs never
      # re-parse the tag (a loose re-parse keying on `-rc.` with the dot would
      # mis-class `v0.1.0-rc6` as a real release). `prerelease` is the string
      # "true" for ANY tag whose core carries an `-rc` suffix (rc.N or rcN),
      # "false" for a real `vX.Y.Z`. The publish job consumes this verbatim.
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The RUST_TOOLCHAIN env duplicates `channel` in rust-toolchain.toml. They
      # MUST agree — a silent divergence would build/gate the release on a different
      # toolchain than the one the repo pins for local dev. Assert equality at the
      # earliest gate so a drift fails the release here, not somewhere downstream.
      - name: assert RUST_TOOLCHAIN matches rust-toolchain.toml
        run: |
          set -euo pipefail
          TOML_CHANNEL="$(grep -m1 '^channel = ' rust-toolchain.toml | sed -E 's/^channel = "([^"]+)".*/\1/')"
          if [ "${RUST_TOOLCHAIN}" != "${TOML_CHANNEL}" ]; then
            echo "::error::RUST_TOOLCHAIN env ('${RUST_TOOLCHAIN}') != rust-toolchain.toml channel ('${TOML_CHANNEL}') — reconcile the two before tagging"
            exit 1
          fi

      # Materialize the rust-toolchain.toml pin (1.91.1 + rustfmt/clippy) via the
      # preinstalled rustup on the ephemeral runner. `rustup show` installs the
      # pinned channel + its declared components on first use.
      - name: install pinned rust toolchain (rust-toolchain.toml)
        run: rustup show

      # Tag must be a semver shape (vX.Y.Z, optionally -rc.N / -rcN). Reject loose
      # `v*` tags that slipped past the broad trigger.
      - name: validate tag is semver
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.?[0-9]+)?$'; then
            echo "::error::tag '$TAG' is not a semver release tag (expected vX.Y.Z or vX.Y.Z-rc.N)"
            exit 1
          fi
          # Strip the leading 'v' for downstream artifact naming.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # Classify rc-vs-real ONCE, here, off the SAME validated tag (the regex
          # above already accepted only `-rc.N` / `-rcN`). Any tag whose core
          # carries an `-rc` suffix is a PRERELEASE; a bare vX.Y.Z is a real
          # release. The publish job reuses this output verbatim — it never
          # re-parses the tag (see preflight.outputs.prerelease).
          if printf '%s' "$TAG" | grep -Eq -- '-rc\.?[0-9]+$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # The git tag must equal the workspace Cargo version — prevents shipping a
      # binary whose --version disagrees with the release tag.
      - name: assert tag matches workspace Cargo version
        run: |
          set -euo pipefail
          CARGO_VER="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          TAG_VER="${{ steps.version.outputs.version }}"
          # Compare on the release core (ignore any -rc suffix for the match).
          if [ "${TAG_VER%%-*}" != "$CARGO_VER" ]; then
            echo "::error::tag version '$TAG_VER' != Cargo workspace version '$CARGO_VER'"
            exit 1
          fi

      # Assert the CI/conformance tenant is UNMETERED before build/publish, so a future
      # low `tenant_quota` row can't silently re-block the mandatory conformance gate
      # (the 402 that blocked v0.1.6-rc.1). Reads the server's least-privilege quota
      # endpoint. LENIENT on endpoint transients — fail ONLY on a definitive "metered"
      # answer; the mandatory conformance gate remains the backstop, so a flaky read
      # never false-blocks a release. Skips (green) if the key isn't provisioned.
      - name: assert CI tenant is unmetered (quota read-endpoint)
        env:
          CLW_CI_QUOTA_READ_KEY: ${{ secrets.CLW_CI_QUOTA_READ_KEY }}
          CLW_CI_TENANT: ${{ secrets.CLW_CI_TENANT }}
          CLW_CI_ENDPOINT: ${{ secrets.CLW_CI_ENDPOINT }}
        run: |
          set -uo pipefail
          if [ -z "${CLW_CI_QUOTA_READ_KEY:-}" ]; then
            echo "::warning::CLW_CI_QUOTA_READ_KEY unset — skipping the unmetered assertion (the mandatory conformance gate still 402s a metered tenant)."
            exit 0
          fi
          ep="${CLW_CI_ENDPOINT:-https://corelink-api.humangr.com}"
          resp="$(curl -s -m 15 -w '\n%{http_code}' -H "x-corelink-internal-auth: ${CLW_CI_QUOTA_READ_KEY}" "${ep}/_internal/tenant/${CLW_CI_TENANT}/quota" || true)"
          code="$(printf '%s' "$resp" | tail -1)"
          body="$(printf '%s' "$resp" | head -1)"
          if [ "$code" = "404" ]; then
            echo "no quota row (404) => inherits the \$1M default => unmetered. OK."
            exit 0
          fi
          if [ "$code" = "200" ]; then
            if printf '%s' "$body" | grep -q '"unmetered":true'; then
              echo "CI tenant unmetered (200, unmetered=true). OK."
              exit 0
            fi
            echo "::error::CI/conformance tenant is METERED (200, unmetered=false) — a release risks the conformance gate 402'ing. Raise its monthly_budget_usd_micros to \$1M before tagging."
            exit 1
          fi
          case "$code" in
            401|400)
              # A definitive auth/tenant error (not a transient) means the secret is misconfigured
              # — the guard is silently NOT asserting. Still don't block (conformance backstops a
              # metered tenant), but make the ROT visible/distinct so it gets fixed.
              echo "::warning::quota read-endpoint returned HTTP ${code} — CLW_CI_QUOTA_READ_KEY or CLW_CI_TENANT looks MISCONFIGURED (rotated/wrong); the unmetered pre-assert is NOT running. Conformance still backstops a metered tenant, but fix the secret so this guard works again." ;;
            *)
              echo "::warning::quota read-endpoint returned HTTP ${code} (transient/unavailable) — NOT blocking; the mandatory conformance gate is the backstop for a metered tenant." ;;
          esac
          exit 0

      # gates.sh's FULL lane runs `cargo deny check` + `cargo audit` (no install
      # guard) and a windows-gnu cross-CHECK whose `ring` C build needs the mingw-w64
      # cross-CC — provision them on the ephemeral runner (prebuilt = no slow compile),
      # mirroring ci.yml's gates job.
      - name: install cargo-deny + cargo-audit (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.8,cargo-audit@0.22.2
      - name: install mingw-w64 (windows-gnu cross-CC for ring's C build)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64

      # Hard pre-tag gate: the full local gate (fmt + clippy -D warnings + test).
      # An unbuildable / un-lintable tag must never produce a release.
      - name: full gate (scripts/gates.sh)
        run: bash scripts/gates.sh

      # -----------------------------------------------------------------------
      # Supply-chain gate (cargo-deny + cargo-audit) is ALREADY enforced by the
      # `full gate` step above: scripts/gates.sh runs its FULL lane on a tag push
      # (a tag is not a `pull_request`, so the scoped lane never applies), and the
      # FULL lane runs `cargo deny check` + `cargo audit` across the whole workspace
      # (see scripts/gates.sh). A separate step here would be redundant.
      # -----------------------------------------------------------------------

      # -----------------------------------------------------------------------
      # EXTENSION POINT — M3.4 live-conformance pre-tag gate.
      # SUPERSEDED by the standalone `conformance` job below (WP M4.5): the live
      # conformance suite now runs as its own job and is a REQUIRED `needs:`
      # predecessor of `build` and `publish`, so a tag cannot ship if conformance
      # is red. See the `conformance` job for the gate itself.
      # -----------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # STAGE 1b — LIVE CONFORMANCE PRE-TAG GATE (WP M4.5)
  # The conformance suite runs against the live CAS/AC service as the FINAL
  # pre-tag guard, BEFORE any binary is built, signed, or published. It is a
  # standalone job (not folded into preflight) precisely so `build` and
  # `publish` can name it in `needs:` — making it a REQUIRED, blocking
  # predecessor: a tag whose conformance is red cannot reach the signing/publish
  # stages at all.
  #
  # SKIP-NOT-FAIL semantics (intentional):
  #   `clw-conformance --features live` is written to be env-skip-safe — without
  #   a service PAT it skips its live cases and the job goes GREEN. That keeps
  #   the scaffold dry-runnable on forks / before secrets exist. The skip is a
  #   DELIBERATE no-op, NOT a true gate: until the PAT secret below is
  #   provisioned, a red service would NOT block a tag (the suite simply skips).
  #   Once `CLW_CI_TOKEN` is provisioned, the suite exercises the live cases and
  #   this becomes a genuine ship-blocking gate.
  # ---------------------------------------------------------------------------
  conformance:
    name: live conformance gate (pre-tag)
    needs: preflight
    # `corelink` — ephemeral CF-Firecracker Linux (zero hosted spend); a network
    # test against live prod.
    runs-on: corelink
    timeout-minutes: 30
    env:
      # CI service identity for the live conformance suite. The suite reads these
      # and SKIPS its live cases (green) when the PAT is absent — see the
      # SKIP-NOT-FAIL note above.
      # TODO(OWNER): provision the conformance service PAT secret (CLW_CI_TOKEN),
      #   plus the CI tenant + endpoint, so this becomes a true ship-blocking gate
      #   instead of an env-skipped no-op.
      CLW_CI_TOKEN: ${{ secrets.CLW_CI_TOKEN }}
      CLW_CI_TENANT: ${{ secrets.CLW_CI_TENANT }}
      CLW_CI_ENDPOINT: ${{ secrets.CLW_CI_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      # Materialize the rust-toolchain.toml pin (1.91.1) via the preinstalled
      # rustup on the ephemeral runner.
      - name: install pinned rust toolchain (rust-toolchain.toml)
        run: rustup show

      - name: announce gate mode (true gate vs. env-skip)
        run: |
          set -euo pipefail
          if [ -z "${CLW_CI_TOKEN:-}" ]; then
            echo "::warning::CLW_CI_TOKEN absent — live conformance cases will SKIP (green)."
            echo "::warning::This is an intentional env-skip, NOT a gate. Provision the PAT secret to make it ship-blocking."
          else
            echo "CLW_CI_TOKEN present — running live conformance as a ship-blocking pre-tag gate."
          fi

      # The suite is env-skip-safe: with no PAT the live cases skip and this is
      # GREEN; with the PAT provisioned a red service FAILS this job and (via the
      # `needs:` edges) blocks build/sign/publish.
      - name: live conformance suite (clw-conformance --features live)
        env:
          # CRITICAL: the suite reads CLW_TOKEN/CLW_TENANT/CLW_ENDPOINT
          # (clw-conformance/tests/live_conformance.rs::try_config), NOT the
          # CLW_CI_* names. Map the CI service-identity secrets onto the names the
          # suite actually reads — without this mapping every live case skips even
          # when the PAT is provisioned, leaving the gate a permanent false-green.
          CLW_TOKEN: ${{ secrets.CLW_CI_TOKEN }}
          CLW_TENANT: ${{ secrets.CLW_CI_TENANT }}
          CLW_ENDPOINT: ${{ secrets.CLW_CI_ENDPOINT }}
          # Null the ambient env-0 cred trio: a `corelink` box injects a single-use
          # cred ticket (CLW_CRED_TICKET/CLW_LEASE_ID/CLW_FABRIC_ENDPOINT) bound to
          # its SPAWN tenant (dogfood) — a different tenant than CLW_TENANT. The
          # cred-ticket-redeem journey would redeem it and hit /v1/ac/<CLW_TENANT>
          # with a dogfood-bound PAT → a correct cross-tenant 403 (isolation), a
          # false red. Null the trio so that journey soft-skips (require-safe).
          CLW_CRED_TICKET: ""
          CLW_LEASE_ID: ""
          CLW_FABRIC_ENDPOINT: ""
        run: |
          set -euo pipefail
          # For a REAL (non-prerelease) tag the live conformance gate is MANDATORY:
          # an absent PAT can no longer skip-green and ship an unconformed binary.
          # rc/prerelease tags keep the skip-green dry-run behavior.
          if [ "${{ needs.preflight.outputs.prerelease }}" = "false" ] && [ -z "${CLW_TOKEN:-}" ]; then
            echo "::error::real tag (non-prerelease) with no CLW_CI_TOKEN — the live conformance gate cannot run and MUST NOT be skipped for a real release. Provision the PAT secret before tagging a real version."
            exit 1
          fi
          # When the PAT is provisioned, REQUIRE every live case to actually run:
          # CLW_CONFORMANCE_REQUIRE=1 turns a skip (missing cred OR a 405/501
          # unavailable endpoint) into a hard failure, so a red/unreachable service
          # blocks the tag. Absent the PAT (rc only, per the guard above), leave
          # REQUIRE unset so the suite skips GREEN (the intentional dry-run).
          if [ -n "${CLW_TOKEN:-}" ]; then
            echo "PAT present — requiring live conformance (skip => hard fail)."
            export CLW_CONFORMANCE_REQUIRE=1
          fi
          cargo test -p clw-conformance --features live

  # ---------------------------------------------------------------------------
  # STAGE 2 + 3 — BUILD MATRIX (+ SIGN folded into each leg)
  # Signing is folded into the matching-OS build leg so unsigned binaries are
  # never shuttled between runners (that shuttle is itself a supply-chain risk).
  # Each leg: build -> sign (OS-specific) -> upload a per-leg signed artifact.
  # ---------------------------------------------------------------------------
  build:
    name: build+sign (${{ matrix.target }})
    # `conformance` is a REQUIRED predecessor (WP M4.5): no binary is built or
    # signed until the live conformance gate is green.
    needs: [preflight, conformance]
    # ALL five targets build on the repo's self-hosted Mac runner `clw-mac-1`
    # (labels: self-hosted, macOS, X64 — an Intel host, $0 CF), mirroring the
    # proven corelink-server release mechanism: darwin native, and the Linux +
    # windows-gnu targets cross-compiled with cargo-zigbuild (zig supplies the libc
    # + linker). A real macOS host is required for codesign/notarize anyway, so
    # every leg folds onto it at no extra cost. (NB: this repo's Mac carries the
    # `macOS` label, NOT the server's `corelink-builder` — verified against the live
    # runner registration.)
    runs-on: [self-hosted, macOS, X64]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The fleet is one physical Mac; cap parallelism so 5 concurrent builds do
      # not thrash CPU/RAM (mirrors release-cli.yml). 5/3 = two batches.
      max-parallel: 3
      matrix:
        include:
          # --- macOS (Apple Silicon host, native `cargo build`) -------------
          - target: aarch64-apple-darwin
            platform: macos
            ext: ""
          # --- macOS (Intel: native cross on the Apple-Silicon host; the Apple
          #     toolchain builds both arches with the system linker) ----------
          - target: x86_64-apple-darwin
            platform: macos
            ext: ""
          # --- Windows (x86_64, gnu ABI: cross via cargo-zigbuild on the Mac —
          #     zig provides the gnu libc + linker; msvc would need the msvc
          #     toolchain, a future option) ----------------------------------
          - target: x86_64-pc-windows-gnu
            platform: windows
            ext: ".exe"
          # --- Linux (x86_64, cross via cargo-zigbuild on the Mac) -----------
          - target: x86_64-unknown-linux-gnu
            platform: linux
            ext: ""
          # --- Linux (aarch64, cross via cargo-zigbuild on the Mac) ----------
          - target: aarch64-unknown-linux-gnu
            platform: linux
            ext: ""
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      # Final per-target asset basename. Keep this in lockstep with the M2.5
      # installer (scripts/install.sh) and docs/INSTALL.md asset-naming.
      ASSET: clw-${{ needs.preflight.outputs.version }}-${{ matrix.target }}${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v4

      # Rust from the pre-installed HOST toolchain (rust-toolchain.toml channel) +
      # this leg's target. NEVER `rustup install`/`default` on the shared-$HOME Mac
      # fleet — the os-error-2 crash + reproducibility-pin drift the helper prevents.
      - name: use the workspace-pinned host toolchain (provisions nothing)
        shell: bash
        run: bash scripts/ci-use-host-toolchain.sh "${{ matrix.target }}"

      # zig cross-toolchain (Linux + windows-gnu only): libc headers + linker for
      # the cross targets. The darwin targets build natively (zigcc has an upstream
      # iconv/charset bug for darwin-on-darwin), so they skip zig. The Mac host has
      # zig via `brew install zig`; hard-fail with that instruction if it is absent
      # (do NOT fall back to a hosted setup action — zero-hosted mandate).
      - name: ensure zig is present (Linux + Windows cross)
        if: matrix.platform != 'macos'
        shell: bash
        run: |
          set -euo pipefail
          if command -v zig >/dev/null 2>&1; then
            echo "zig found at $(command -v zig)"
          else
            echo "::error::zig is required for the ${{ matrix.target }} cross build but is not installed on this runner host. Run once on the host: brew install zig" >&2
            exit 1
          fi

      # cargo-zigbuild as a PREBUILT binary (Linux + Windows only). NOT
      # `cargo install` — that compiles into the shared ~/.cargo all runners use at
      # once (the os-error-2 race). install-action is a no-op when already present.
      - name: install cargo-zigbuild (prebuilt, Linux + Windows cross)
        if: matrix.platform != 'macos'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.19.8

      # Exit-126 guard: cargo-zigbuild writes zigcc-*.sh linker wrappers under
      # ~/Library/Caches/cargo-zigbuild/; a cache restore can strip their execute
      # bit. chmod +x unconditionally (they are tiny). Ported from release-cli.yml.
      - name: fix zigcc linker-script permissions (exit-126 guard)
        if: matrix.platform != 'macos'
        shell: bash
        run: |
          ZIGBUILD_CACHE="$HOME/Library/Caches/cargo-zigbuild"
          if [ -d "$ZIGBUILD_CACHE" ]; then
            find "$ZIGBUILD_CACHE" -name '*.sh' -exec chmod +x {} +
            echo "fixed zigcc wrapper perms in $ZIGBUILD_CACHE"
          else
            echo "no zigcc cache dir yet — wrappers will be created fresh"
          fi

      # Reproducible build: SOURCE_DATE_EPOCH from the commit timestamp.
      - name: set SOURCE_DATE_EPOCH
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # windows-gnu cache-integrity fix: the `windows_x86_64_gnu` crate ships a
      # static archive the linker consumes; a partial cache restore can drop it.
      # Re-fetch so the .a is present. Ported from release-cli.yml.
      - name: re-fetch windows-rs deps (cache integrity fix)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME"/.cargo/registry/src/index.crates.io-*/windows_x86_64_gnu-* || true
          rm -rf "$HOME"/.cargo/registry/src/index.crates.io-*/windows-targets-* || true
          cargo fetch --target "${{ matrix.target }}"

      # Strip absolute dev-host paths from the shipped binary (no $HOME/username
      # leak in `strings`); map known prefixes to short placeholders.
      - name: set RUSTFLAGS path-remap
        shell: bash
        run: |
          REMAP=""
          REMAP="$REMAP --remap-path-prefix=$HOME/.cargo/registry=cargo-registry"
          REMAP="$REMAP --remap-path-prefix=$HOME/.cargo/git=cargo-git"
          REMAP="$REMAP --remap-path-prefix=$HOME/.rustup=rustup"
          REMAP="$REMAP --remap-path-prefix=$GITHUB_WORKSPACE=clw"
          echo "RUSTFLAGS=$REMAP" >> "$GITHUB_ENV"

      - name: build release binary (cargo zigbuild — Linux + Windows)
        if: matrix.platform != 'macos'
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          RUSTFLAGS: ${{ env.RUSTFLAGS }}
        run: cargo zigbuild --release --locked -p clw-cli --target "${{ matrix.target }}"

      - name: build release binary (cargo build, native — macOS)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          RUSTFLAGS: ${{ env.RUSTFLAGS }}
        run: cargo build --release --locked -p clw-cli --target "${{ matrix.target }}"

      - name: stage the binary under its per-target asset name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/clw${{ matrix.ext }}" "dist/${ASSET}"

      # =======================================================================
      # SIGN — macOS: Developer ID codesign + notarize.
      # A bare Mach-O CLI CANNOT be `xcrun stapler staple`d (only bundles / .pkg
      # / .dmg can). We notarize a ZIP (or a .pkg — see DISTRIBUTION.md decision
      # (c)); the consumer-side check is then a Gatekeeper assessment of the
      # notarized artifact, not a staple check.
      # =======================================================================
      - name: sign + notarize (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          # TODO(OWNER): provision these secrets (see docs/DISTRIBUTION.md).
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}          # "Developer ID Application: ..."
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}  # App Store Connect API .p8
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ]; then
            # WAIVED-OPEN by design (do NOT make this fail-closed like the minisign
            # steps): macOS Developer-ID + notarization is deferred per the CLAUDE.md
            # owner waiver (no Apple Developer account yet), so these secrets are
            # INTENTIONALLY absent on every real release — a fail-closed guard here
            # would break every release. When the owner provisions the cert, apply the
            # same `prerelease == false` fail-closed guard the minisign steps use.
            echo "::warning::macOS signing secrets absent — SKIPPING sign+notarize (deferred per owner waiver; brew/install.sh strip quarantine)."
            exit 0
          fi
          # Real Developer ID codesign + notarize of a notarized ZIP (DISTRIBUTION.md (c)).
          # 1. Import the Developer ID .p12 into an ephemeral keychain.
          KEYCHAIN="$RUNNER_TEMP/clw-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          # Cleanup on ANY exit (incl. a mid-step failure under set -e): never leave
          # the ephemeral keychain or the p12/p8 key material on the runner.
          trap 'security delete-keychain "$KEYCHAIN" 2>/dev/null || true; rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"' EXIT
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          # shellcheck disable=SC2046  # intentional: word-split the existing keychain list to re-add it alongside ours
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          # 2. Sign the bare Mach-O with the hardened runtime + a secure timestamp.
          codesign --force --options runtime --timestamp \
            --keychain "$KEYCHAIN" --sign "$MACOS_SIGN_IDENTITY" "dist/${ASSET}"
          codesign --verify --strict --verbose=2 "dist/${ASSET}"
          # 3. A bare CLI binary cannot be stapled; notarize a ZIP of it instead.
          ditto -c -k --keepParent "dist/${ASSET}" "dist/${ASSET}.zip"
          printf '%s' "$MACOS_NOTARY_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/notary.p8"
          # Capture the notarytool result as JSON and ASSERT status == "Accepted":
          # `--wait` alone returns 0 even for an "Invalid" submission, so an implicit
          # exit could ship an UN-notarized binary. Parse .status and hard-fail unless
          # the ticket was accepted.
          NOTARY_JSON="$(xcrun notarytool submit "dist/${ASSET}.zip" --wait --output-format json \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID")"
          echo "$NOTARY_JSON"
          NOTARY_STATUS="$(printf '%s' "$NOTARY_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("status",""))')"
          if [ "$NOTARY_STATUS" != "Accepted" ]; then
            echo "::error::notarization did not succeed (status='${NOTARY_STATUS}', expected 'Accepted')"
            exit 1
          fi
          # 4. Gatekeeper assessment of the notarized zip (bare CLI -> no staple). NOT
          # force-passed: a Gatekeeper rejection of our own notarized artifact must
          # FAIL the step.
          spctl -a -t open --context context:primary-signature -v "dist/${ASSET}.zip"
          # 5. Leave NO key material on the runner.
          security delete-keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8"

      # =======================================================================
      # SIGN — Windows: Authenticode via CLOUD / HSM signing.
      # Post-2023 CA/Browser-Forum rules forbid exportable code-signing keys, so
      # there is NO .pfx to drop in a secret. Use Azure Trusted Signing (default)
      # or DigiCert KeyLocker — see DISTRIBUTION.md decision (b).
      # =======================================================================
      - name: sign (Windows, Authenticode via Azure Trusted Signing)
        if: matrix.platform == 'windows'
        shell: bash
        env:
          # TODO(OWNER): provision Azure Trusted Signing credentials. OIDC via
          # azure/login is the preferred alternative; the env-only path below uses a
          # client secret (DefaultAzureCredential reads AZURE_TENANT_ID /
          # AZURE_CLIENT_ID / AZURE_CLIENT_SECRET straight from the environment).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}   # e.g. https://eus.codesigning.azure.net
        run: |
          set -euo pipefail
          if [ -z "${AZURE_TENANT_ID:-}" ]; then
            # WAIVED-OPEN by design (do NOT make this fail-closed like the minisign
            # steps): Windows Authenticode via Azure Trusted Signing is deferred per the
            # CLAUDE.md owner waiver (no Azure signing account yet), so these secrets are
            # INTENTIONALLY absent on every real release. When the owner provisions the
            # account, apply the same `prerelease == false` fail-closed guard.
            echo "::warning::Windows signing credentials absent — SKIPPING Authenticode sign (deferred per owner waiver)."
            exit 0
          fi
          # Real Authenticode via Azure Trusted Signing, driven by the dotnet `sign`
          # CLI (it speaks Trusted Signing and authenticates with DefaultAzureCredential
          # from the AZURE_* env above). azure/login OIDC is the documented alternative
          # to the client-secret env path.
          dotnet tool install --global sign --version 1.1.5
          export PATH="$PATH:$HOME/.dotnet/tools"
          sign code trusted-signing "dist/${ASSET}" \
            --trusted-signing-endpoint "$AZURE_ENDPOINT" \
            --trusted-signing-account "$AZURE_CODE_SIGNING_ACCOUNT" \
            --trusted-signing-certificate-profile "$AZURE_CERT_PROFILE" \
            --timestamp-url "http://timestamp.acs.microsoft.com" \
            --file-digest SHA256 \
            --verbosity information
          # Authenticode VERIFICATION is intentionally NOT run here: signtool /
          # Get-AuthenticodeSignature are Windows-only, and this gnu .exe is signed on
          # the macOS build host. The signature is verified downstream on a Windows
          # consumer (the OS validates the Authenticode chain at install/run time).

      # =======================================================================
      # SIGN — Linux: minisign detached signature (default). sigstore/cosign is a
      # documented alternative (see DISTRIBUTION.md decision (d)). Produces
      # `<asset>.minisig`. The public key is committed + published for consumers.
      # =======================================================================
      - name: sign (Linux, minisign detached)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          # TODO(OWNER): provision the minisign secret key + passphrase.
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}  # base64 of the minisign.key
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            # FAIL-CLOSED on a REAL release (same posture as the signed-checksums step):
            # the per-binary .minisig is the signature-of-record, so a real vX.Y.Z MUST
            # NOT ship an unsigned Linux binary. rc/prerelease tags keep the dry-run skip.
            if [ "${{ needs.preflight.outputs.prerelease }}" = "false" ]; then
              echo "::error::minisign secret absent on a REAL release tag — refusing to ship an UNSIGNED Linux binary. Provision MINISIGN_SECRET_KEY before tagging a real version."
              exit 1
            fi
            echo "::warning::minisign secret absent — SKIPPING Linux signature (rc/prerelease dry-run only)."
            exit 0
          fi
          # Real minisign detached signature -> dist/${ASSET}.minisig.
          # This leg now builds+signs on the self-hosted Mac (corelink-builder),
          # so install minisign via brew (NOT apt), skipping if already present.
          if ! command -v minisign >/dev/null 2>&1; then
            brew install minisign
          fi
          printf '%s' "$MINISIGN_SECRET_KEY" | base64 -d > minisign.key
          trap 'rm -f minisign.key' EXIT   # remove the key even if signing aborts under set -e
          echo "$MINISIGN_PASSWORD" | minisign -S -s minisign.key -m "dist/${ASSET}"
          rm -f minisign.key   # leave NO key material on the runner
          # Self-verify against the committed public key (the trust-root) when present.
          if [ -f "docs/minisign.pub" ]; then
            minisign -V -p docs/minisign.pub -m "dist/${ASSET}"
          else
            echo "::warning::docs/minisign.pub not committed yet — signature produced but not self-verified."
          fi

      # Upload the (eventually) signed binary + its signature/zip for the publish job.
      - name: upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: clw-${{ matrix.target }}
          # `*` so the per-OS signature/zip files ride along once signing is wired.
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # STAGE 3b — SBOM (WP M4.3)
  # Generate a CycloneDX SBOM for the whole workspace and ship it as a release
  # artifact alongside the binaries. The SBOM is uploaded as a build artifact
  # here and re-collected by `publish` into the release/ dir so it is checksummed
  # and pushed to the download surface with the binaries.
  #
  # Gated on `conformance` (no SBOM for a tag that failed the live gate) but NOT
  # on `build`: the SBOM is derived from the dependency graph (Cargo.lock), not
  # from the compiled binaries, so it can run in parallel with the matrix.
  # ---------------------------------------------------------------------------
  sbom:
    name: sbom (CycloneDX)
    needs: [preflight, conformance]
    # `corelink` — ephemeral CF-Firecracker Linux (zero hosted spend); derived from
    # Cargo.lock, no network/secret.
    runs-on: corelink
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      SBOM: clw-${{ needs.preflight.outputs.version }}.cdx.json
    steps:
      - uses: actions/checkout@v4

      # Materialize the rust-toolchain.toml pin (1.91.1) via the preinstalled rustup
      # on the ephemeral runner.
      - name: install pinned rust toolchain (rust-toolchain.toml)
        run: rustup show

      # cargo-cyclonedx emits a CycloneDX SBOM straight from the Cargo metadata /
      # Cargo.lock — no network egress and no signing secret, so this needs NO
      # owner-gated credential and runs fully in the scaffold. Installed from a
      # PREBUILT release via taiki-e/install-action (avoids a slow from-source
      # compile on the ephemeral runner).
      - name: install cargo-cyclonedx
        # Pin the version: a breaking cargo-cyclonedx release must NOT silently
        # change or break the SBOM at tag time. Bump deliberately after re-verifying
        # the flags below.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: generate CycloneDX SBOM (workspace, JSON)
        run: |
          set -euo pipefail
          mkdir -p dist
          # cargo-cyclonedx 0.5.x with --override-filename writes ONE FILE PER workspace
          # member at <member-dir>/<name>.json — extension .json, NOT .cdx.json, and no
          # aggregated root file (verified against 0.5.9). The shipped binary is clw-cli,
          # whose SBOM carries the full transitive dep tree that actually ships, so that
          # is the canonical release SBOM. Collect every member SBOM into dist/ as
          # .cdx.json (they ARE CycloneDX JSON) and copy clw-cli's to the canonical name.
          cargo cyclonedx --all --format json --override-filename "clw-${VERSION}"
          found=0
          while IFS= read -r f; do
            crate="$(basename "$(dirname "$f")")"
            cp "$f" "dist/${crate}.cdx.json"
            found=1
          done < <(find crates -name "clw-${VERSION}.json")
          if [ -f "crates/clw-cli/clw-${VERSION}.json" ]; then
            cp "crates/clw-cli/clw-${VERSION}.json" "dist/${SBOM}"
            found=1
          fi
          if [ "$found" != "1" ]; then
            echo "::error::cargo-cyclonedx produced no SBOM (expected crates/*/clw-${VERSION}.json) — its output naming may have changed; re-check the flags before bumping"
            exit 1
          fi
          echo "---- SBOM files ----"
          ls -la dist/

      - name: upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: clw-sbom
          path: dist/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # STAGE 4 — CHECKSUM + PUBLISH (REWORKED — public mirror + brew, WP-B/WP-C)
  # Collect every signed artifact, produce one signed SHA256SUMS, then publish a
  # PUBLIC GitHub Release on the dedicated mirror repo `HuGR-Labs/clw-releases`
  # (the source repo `corelink-workspaces` is PRIVATE, so its own Release assets
  # are not public — see DISTRIBUTION-REWORK-PLAN §8 B1). After a real upload,
  # add SLSA build-provenance attestation, then bump the Homebrew formula in
  # `HuGR-Labs/homebrew-clw` (real tags only). minisign stays the offline
  # signature-of-record; attestation is the added provenance layer.
  # ---------------------------------------------------------------------------
  publish:
    name: checksum + publish
    # `conformance` named explicitly (WP M4.5) so the gate is an unambiguous
    # predecessor of publish/sign — a red conformance tag never ships.
    needs: [preflight, conformance, build, sbom]
    # `corelink` — ephemeral CF-Firecracker Linux (zero hosted spend). minisign +
    # cargo-about install here; gh is baked for the cross-repo mirror Release.
    runs-on: corelink
    timeout-minutes: 20
    # Provenance attestation needs to mint an OIDC token + write the attestation.
    # `contents: write` is harmless here (the public Release is created on the
    # MIRROR repo via a cross-repo token, not this repo's GITHUB_TOKEN) but is
    # kept for the local attestation store. Least-privilege: nothing broader.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      # rc-vs-real, classified ONCE in preflight (never re-parsed here). "true"
      # for an `-rc` tag (=> --prerelease + NO formula bump), "false" for a real
      # vX.Y.Z (=> latest release + formula bump).
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      # Clean slate: the runner is now ephemeral (GitHub-hosted), so stale state is
      # not expected — but keep this defensive rm so a re-run / restored cache can
      # never leave a prior tag's `artifacts/` or `release/` (stale binaries + an
      # old SHA256SUMS / .minisig) to be re-checksummed under the new version.
      - name: clean stale release workspace (defensive)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release artifacts

      # cargo-about (THIRD-PARTY-LICENSES, below) needs cargo — materialize the
      # rust-toolchain.toml pin (1.91.1) via the preinstalled rustup on the
      # ephemeral runner.
      - name: install pinned rust toolchain (rust-toolchain.toml)
        run: rustup show

      # Downloads EVERY uploaded artifact (per-target binaries AND the M4.3
      # `clw-sbom` CycloneDX SBOM) — no `name:` filter, so the SBOM rides along.
      - name: download all signed artifacts + SBOM
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: collect into a flat release dir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # Flatten per-target artifact dirs (binaries, signatures, SBOM) into one
          # release/ dir so the SBOM is checksummed + published with the binaries.
          find artifacts -type f -exec cp {} release/ \;
          # Ship the trust-root (minisign pubkey) + license notices WITH the
          # binaries — and stage them HERE, before the checksum step, so they are
          # covered by SHA256SUMS (previously copied in the publish step, after
          # checksumming, so they shipped unverifiable).
          [ -f docs/minisign.pub ] && cp docs/minisign.pub release/ || true
          [ -f EULA.md ] && cp EULA.md release/ || true
          [ -f NOTICE ] && cp NOTICE release/ || true
          ls -la release/

      # Generate the per-release third-party attribution bundle that NOTICE
      # promises. Produced with cargo-about from about.toml/about.hbs (the
      # workspace cargo-about config). Staged into release/ BEFORE the checksum
      # step so it is covered by SHA256SUMS and shipped as a release asset. Hard-
      # fails on any error (NO `|| true`): NOTICE must never reference a bundle we
      # did not actually ship.
      - name: generate THIRD-PARTY-LICENSES bundle (cargo-about)
        shell: bash
        run: |
          set -euo pipefail
          if ! cargo about --version 2>/dev/null | grep -q '0\.9\.0'; then
            echo "cargo-about 0.9.0 absent — installing (one-time)."
            # PINNED + `--features cli`: cargo-about 0.9+ gates its binary behind the
            # `cli` feature (a plain install builds the lib but installs NO `about`
            # subcommand => "no such command: about", caught by rc11); and the version
            # is pinned (like cargo-cyclonedx) because the config schema is
            # version-sensitive — about.toml matches 0.9.0 (rc12 caught a schema drift).
            cargo install cargo-about --locked --features cli --version 0.9.0
          fi
          # `--workspace`: attribute the whole workspace's deps (cargo-about 0.9 moved
          # this from an about.toml key to a CLI flag).
          cargo about generate about.hbs --workspace > release/THIRD-PARTY-LICENSES.md
          echo "generated release/THIRD-PARTY-LICENSES.md"
          ls -la release/

      # SHA-256 over every published binary + signature file, then SIGN the
      # checksum file itself (minisign) — the cross-platform signed-checksum
      # guarantee the roadmap demands.
      - name: signed SHA-256 checksums
        shell: bash
        env:
          # TODO(OWNER): same minisign secret as the Linux leg (see DISTRIBUTION.md (d)).
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cd release
          # SHA-256 over every asset (ubuntu runner: sha256sum; fall back to shasum
          # if ever run elsewhere — both emit the same `<hex>  <file>` format).
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -- * > SHA256SUMS; else shasum -a 256 -- * > SHA256SUMS; fi
          echo "---- SHA256SUMS ----"
          cat SHA256SUMS
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            # FAIL-CLOSED on a REAL release (mirror of the conformance guard at the
            # `validate tag is semver` / live-conformance step): SHA256SUMS.minisig is
            # the cross-platform signature-of-record, so a real vX.Y.Z MUST NOT publish
            # unsigned checksums (and still bump the brew formula) just because the key
            # is absent/rotated-away. rc/prerelease tags keep the dry-run skip.
            if [ "${{ needs.preflight.outputs.prerelease }}" = "false" ]; then
              echo "::error::minisign secret absent on a REAL release tag — refusing to publish UNSIGNED SHA256SUMS (the signature-of-record). Provision MINISIGN_SECRET_KEY before tagging a real version."
              exit 1
            fi
            echo "::warning::minisign secret absent — SHA256SUMS left UNSIGNED (rc/prerelease dry-run only)."
            exit 0
          fi
          # Sign the checksum file itself -> SHA256SUMS.minisig (the cross-platform
          # signed-checksum guarantee the roadmap demands). ubuntu runner: apt.
          if ! command -v minisign >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          fi
          printf '%s' "$MINISIGN_SECRET_KEY" | base64 -d > ../minisign.key
          trap 'rm -f ../minisign.key' EXIT   # remove the key even if signing aborts under set -e
          echo "$MINISIGN_PASSWORD" | minisign -S -s ../minisign.key -m SHA256SUMS
          rm -f ../minisign.key   # leave NO key material on the runner
          echo "---- SHA256SUMS.minisig ----"
          cat SHA256SUMS.minisig
          # Verify the just-produced signature against the COMMITTED trust-root
          # pubkey. Fails loudly if docs/minisign.pub does not correspond to the
          # signing key — otherwise we would publish a trust root that rejects our
          # own signatures. (cwd is release/, so the committed key is ../docs/.)
          if [ -f ../docs/minisign.pub ]; then
            minisign -V -p ../docs/minisign.pub -m SHA256SUMS
            echo "SHA256SUMS verified against committed docs/minisign.pub"
          else
            echo "::warning::docs/minisign.pub absent — cannot verify the signature against the published trust root; commit the minisign public key alongside the secret."
          fi

      # =======================================================================
      # PUBLISH — create a PUBLIC GitHub Release on the MIRROR repo
      # `HuGR-Labs/clw-releases`, uploading ALL of release/* as assets.
      #
      # WHY a cross-repo token: the source repo here is PRIVATE, so its own
      # Release assets are not public. The default GITHUB_TOKEN is scoped to THIS
      # repo and cannot write a Release on another repo — so we authenticate `gh`
      # with a dedicated, repo-bound CLW_RELEASES_TOKEN (deploy key / fine-grained
      # PAT scoped to clw-releases, contents:write).
      #
      # SECRET-GATED (mirrors the old R2 step's no-op): absent CLW_RELEASES_TOKEN
      # => SKIP with a ::warning:: + an `ls release/` (dry-run, green). The rc
      # dry-run therefore stays green until the owner provisions the token.
      #
      # rc-vs-real: a prerelease tag (PRERELEASE=="true", classified once in
      # preflight) passes `--prerelease`; a real vX.Y.Z is published as latest.
      # =======================================================================
      - name: publish GitHub Release on the public mirror (HuGR-Labs/clw-releases)
        id: mirror_release
        shell: bash
        env:
          # TODO(OWNER): provision CLW_RELEASES_TOKEN — a deploy key / fine-grained
          # PAT scoped to ONLY HuGR-Labs/clw-releases, contents:write. The
          # default GITHUB_TOKEN cannot cross repos (confirmed, plan §8 B1).
          GH_TOKEN: ${{ secrets.CLW_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::CLW_RELEASES_TOKEN absent — SKIPPING public mirror Release (dry-run)."
            echo "would create release v${VERSION} on HuGR-Labs/clw-releases (prerelease=${PRERELEASE}) with:"
            ls -la release/
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # rc => --prerelease (do NOT mark latest); real vX.Y.Z => latest.
          PRERELEASE_FLAG=""
          if [ "${PRERELEASE}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
            echo "rc tag — creating a PRERELEASE on the mirror (no formula bump)."
          else
            PRERELEASE_FLAG="--latest"
            echo "real tag — creating a latest Release on the mirror (formula bump follows)."
          fi
          # Create the cross-repo Release and upload every assembled asset. If the
          # release already exists (a re-run of the same tag), upload --clobber
          # rather than fail — the tag is immutable but a re-run must be idempotent.
          if gh release view "v${VERSION}" --repo HuGR-Labs/clw-releases >/dev/null 2>&1; then
            echo "release v${VERSION} already exists on the mirror — uploading assets with --clobber."
            gh release upload "v${VERSION}" release/* --repo HuGR-Labs/clw-releases --clobber
          else
            gh release create "v${VERSION}" release/* \
              --repo HuGR-Labs/clw-releases \
              --title "clw v${VERSION}" \
              --notes "clw ${VERSION} — signed binaries (minisign SHA256SUMS.minisig + minisign.pub), CycloneDX SBOM, SLSA provenance. Proprietary (EULA governs use); binaries publicly downloadable, source closed. macOS: a direct browser download is Gatekeeper-blocked (binary not yet Apple-notarized) — install via 'brew' or install.sh (both strip quarantine), or run 'xattr -d com.apple.quarantine <asset>' after verifying the signature. See docs/INSTALL.md." \
              ${PRERELEASE_FLAG}
          fi
          echo "published release/ -> HuGR-Labs/clw-releases @ v${VERSION} (prerelease=${PRERELEASE})"
          echo "published=true" >> "$GITHUB_OUTPUT"

      # =======================================================================
      # PUBLISH install.sh TO THE PUBLIC MIRROR — REAL tags only.
      # The docs advertise `curl …raw.githubusercontent.com/HuGR-Labs/
      # clw-releases/main/install.sh | sh`, but nothing publishes scripts/install.sh
      # there, so that URL 404s. Push the repo's scripts/install.sh to the mirror's
      # main branch via the GitHub contents API (create-or-update: re-fetch the
      # existing blob sha so a re-run UPDATEs instead of failing). Also upload it as
      # an asset on the mirror Release. SECRET-GATED on CLW_RELEASES_TOKEN (skip with
      # ::warning:: if absent) and gated on a real (non-prerelease) tag.
      # =======================================================================
      - name: publish install.sh to the public mirror (real tags only)
        if: steps.mirror_release.outputs.published == 'true' && needs.preflight.outputs.prerelease == 'false'
        shell: bash
        env:
          # Same scoped token as the mirror Release step (contents:write on
          # HuGR-Labs/clw-releases).
          GH_TOKEN: ${{ secrets.CLW_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::CLW_RELEASES_TOKEN absent — SKIPPING install.sh publish to the mirror (dry-run)."
            exit 0
          fi
          REPO="HuGR-Labs/clw-releases"
          SRC="scripts/install.sh"
          # base64 of the file content (portable: -w0 on GNU, no wrap on BSD).
          CONTENT_B64="$(base64 < "$SRC" | tr -d '\n')"
          # Fetch the existing blob sha (if any) so this is an idempotent
          # create-or-update — the contents API requires the prior sha to UPDATE.
          EXISTING_SHA="$(gh api "repos/${REPO}/contents/install.sh?ref=main" \
            --jq '.sha' 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "null" ]; then
            gh api --method PUT "repos/${REPO}/contents/install.sh" \
              -f message="clw ${VERSION}: publish install.sh" \
              -f branch="main" \
              -f content="$CONTENT_B64" \
              -f sha="$EXISTING_SHA"
            echo "updated install.sh on ${REPO}@main (prior sha ${EXISTING_SHA})"
          else
            gh api --method PUT "repos/${REPO}/contents/install.sh" \
              -f message="clw ${VERSION}: publish install.sh" \
              -f branch="main" \
              -f content="$CONTENT_B64"
            echo "created install.sh on ${REPO}@main"
          fi
          # Also attach install.sh as an asset on the mirror Release (idempotent).
          gh release upload "v${VERSION}" "$SRC" --repo "$REPO" --clobber
          echo "uploaded install.sh as a release asset on ${REPO} @ v${VERSION}"

      # =======================================================================
      # SLSA PROVENANCE — build-provenance attestation for the release binaries.
      # Added provenance layer ON TOP OF minisign (which stays the offline
      # signature-of-record). Runs ONLY after a real successful upload
      # (mirror_release.outputs.published == 'true'); in the dry-run the upload
      # step set published=false, so the `if:` guard makes this a clean no-op.
      # Uses actions/attest-build-provenance (mints provenance via the OIDC token
      # granted by `id-token: write` + `attestations: write` above).
      #
      # PRIVATE-REPO GATE (rc8 finding, 2026-06-18): GitHub artifact attestation
      # is NOT available for a PRIVATE source repo on the current plan — it hard-
      # errors "Feature not available for user-owned private repositories". This
      # repo stays private by design, so the step is GATED on visibility: it runs
      # (and a real failure BLOCKS) only when the repo is public; on a private repo
      # it is SKIPPED and the next step emits a loud ::warning:: so the gap is
      # never silent. WAIVER (owner-authorized, Gustavo, 2026-06-18): SLSA
      # provenance deferred for open beta — the release is still minisign-signed +
      # SHA256SUMS + SBOM. Remediation/pre-GA: GitHub Enterprise (enables private-
      # repo attestation) OR move the build/attest into the public mirror repo.
      # =======================================================================
      - name: SLSA build-provenance attestation (real uploads only, public repo only)
        if: steps.mirror_release.outputs.published == 'true' && github.event.repository.private == false
        uses: actions/attest-build-provenance@v1
        with:
          # Attest the binaries (the artifacts a consumer runs). SHA256SUMS +
          # .minisig already give offline integrity; provenance binds these
          # subjects to this build.
          subject-path: |
            release/clw-${{ env.VERSION }}-*
            release/SHA256SUMS
            release/SHA256SUMS.minisig
            release/*.cdx.json

      - name: SLSA provenance SKIPPED notice (private repo — deferred per waiver)
        if: steps.mirror_release.outputs.published == 'true' && github.event.repository.private == true
        shell: bash
        run: |
          echo "::warning title=SLSA provenance skipped::GitHub artifact attestation is unavailable for this PRIVATE repo on the current plan, so SLSA build-provenance was SKIPPED. The release IS minisign-signed + SHA256SUMS + SBOM. SLSA deferred to pre-GA per owner waiver 2026-06-18 — remediation: GitHub Enterprise, or build/attest from the public mirror repo."

      # =======================================================================
      # HOMEBREW FORMULA BUMP — REAL tags only (PRERELEASE=="false") AND only when
      # HOMEBREW_TAP_TOKEN is present. Checks out HuGR-Labs/homebrew-clw, bumps
      # `version` + each of the 4 brew platforms' url+sha256 (aarch64/x86_64 ×
      # darwin/linux; Windows is not brew), then commits + pushes to the tap.
      #
      # sha256 SINGLE SOURCE OF TRUTH: parsed from the published SHA256SUMS — never
      # recomputed (recompute => drift => a formula that rejects the binary, R4).
      #
      # SECRET-GATED + rc-gated: absent HOMEBREW_TAP_TOKEN OR a prerelease tag =>
      # SKIP with a note (clean green). Runs only after the mirror Release
      # actually published (so the formula never points at missing binaries, R5).
      # =======================================================================
      - name: bump Homebrew formula in the tap (real tags only)
        if: steps.mirror_release.outputs.published == 'true' && needs.preflight.outputs.prerelease == 'false'
        shell: bash
        env:
          # TODO(OWNER): provision HOMEBREW_TAP_TOKEN — deploy key / fine-grained
          # PAT scoped to ONLY HuGR-Labs/homebrew-clw, contents:write (R3).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN absent — SKIPPING Homebrew formula bump (dry-run)."
            echo "would bump HuGR-Labs/homebrew-clw Formula/clw.rb to version ${VERSION} with url+sha256 from release/SHA256SUMS:"
            grep -E "clw-${VERSION}-(aarch64|x86_64)-(apple-darwin|unknown-linux-gnu)$" release/SHA256SUMS || true
            exit 0
          fi
          # Parse the sha256 for one asset out of the published SHA256SUMS (the
          # single source of truth). SHA256SUMS lines are `<hex>  <filename>`.
          sha_for() {
            local asset="$1"
            local line
            line="$(grep -E "  ${asset}\$" release/SHA256SUMS || true)"
            if [ -z "$line" ]; then
              echo "::error::no SHA256SUMS entry for ${asset} — cannot bump formula" >&2
              return 1
            fi
            printf '%s' "$line" | awk '{print $1}'
          }
          BASE_URL="https://github.com/HuGR-Labs/clw-releases/releases/download/v${VERSION}"
          # The 4 brew platforms (Windows is NOT brew — excluded).
          A_DARWIN="clw-${VERSION}-aarch64-apple-darwin"
          X_DARWIN="clw-${VERSION}-x86_64-apple-darwin"
          A_LINUX="clw-${VERSION}-aarch64-unknown-linux-gnu"
          X_LINUX="clw-${VERSION}-x86_64-unknown-linux-gnu"
          SHA_A_DARWIN="$(sha_for "$A_DARWIN")"
          SHA_X_DARWIN="$(sha_for "$X_DARWIN")"
          SHA_A_LINUX="$(sha_for "$A_LINUX")"
          SHA_X_LINUX="$(sha_for "$X_LINUX")"

          # Check out the tap with the scoped token and regenerate Formula/clw.rb.
          TAP_DIR="$RUNNER_TEMP/homebrew-clw"
          rm -rf "$TAP_DIR"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/HuGR-Labs/homebrew-clw.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Formula"
          cat > "$TAP_DIR/Formula/clw.rb" <<EOF
          # clw — CoreLink workspaces CLI. PROPRIETARY: the EULA governs use; the
          # binary is publicly downloadable but the source is closed. This formula
          # is AUTO-GENERATED by the release pipeline — do not hand-edit.
          class Clw < Formula
            desc "CoreLink workspaces CLI"
            homepage "https://github.com/HuGR-Labs/clw-releases"
            version "${VERSION}"
            # Closed-source: brew has no SPDX expression for this. tap CI gates on
            # \`brew style\` only (NOT \`brew audit --strict\`, which rejects this).
            license :cannot_represent

            on_macos do
              on_arm do
                url "${BASE_URL}/${A_DARWIN}"
                sha256 "${SHA_A_DARWIN}"
              end
              on_intel do
                url "${BASE_URL}/${X_DARWIN}"
                sha256 "${SHA_X_DARWIN}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE_URL}/${A_LINUX}"
                sha256 "${SHA_A_LINUX}"
              end
              on_intel do
                url "${BASE_URL}/${X_LINUX}"
                sha256 "${SHA_X_LINUX}"
              end
            end

            def install
              bin.install Dir["clw-*"].first => "clw"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/clw --version")
            end
          end
          EOF
          cd "$TAP_DIR"
          git config user.name "clw-release-bot"
          git config user.email "release-bot@humangr.com"
          if git diff --quiet -- Formula/clw.rb; then
            echo "Formula/clw.rb already at version ${VERSION} — nothing to bump."
            exit 0
          fi
          git add Formula/clw.rb
          git commit -m "clw ${VERSION} (auto-bump from clw-releases v${VERSION})"
          git push origin HEAD
          echo "bumped HuGR-Labs/homebrew-clw Formula/clw.rb -> ${VERSION}"
