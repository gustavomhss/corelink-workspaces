# cargo-deny config for the DEV-ONLY fuzz harness (fuzz/ — a detached workspace).
#
# Why a SEPARATE config from the root deny.toml: the root allow-list is the
# shipped-binary license posture and is mirrored 1:1 by about.toml `accepted`.
# Nothing in fuzz/ ever ships in `clw` (libfuzzer-sys / arbitrary are pulled in
# only under nightly `cargo fuzz`), so its license atoms must NOT pollute that
# list. This config gates fuzz/Cargo.lock with the SAME advisory/sources/bans
# rigor, with the allow-list extended only by the licenses the fuzz driver adds.
#
# Run (opt-in dev lane):  CLW_FUZZ_GATE=1 bash scripts/gates.sh
# or directly:  cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check

[graph]
all-features = true

[advisories]
# Identical fail-closed posture to the root: any open advisory is a hard failure,
# yanked crates are denied, no silent waivers.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
private = { ignore = true }
allow = [
    # First-party proprietary marker (clw-fuzz + the clw-types crate under test).
    "LicenseRef-Proprietary",
    # Permissive third-party set (same as the shipped allow-list)...
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # ...plus the one license that exists ONLY in the dev-only fuzz harness:
    # libfuzzer-sys is `(MIT OR Apache-2.0) AND NCSA`. NCSA (University of
    # Illinois/NCSA Open Source License) is OSI-approved + FSF-Free, a permissive
    # BSD-3-Clause-style license bundled with LLVM's libFuzzer. Allowed here and
    # ONLY here because the fuzz harness never ships — it stays out of the
    # shipped-binary allow-list (root deny.toml / about.toml `accepted`).
    "NCSA",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
# Same closed-supply-chain guarantee: crates.io only, no unknown registries/git.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
