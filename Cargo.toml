[workspace]
resolver = "2"
members = [
    "crates/clw-types",
    "crates/clw-chunk",
    "crates/clw-client",
    "crates/clw-manifest",
    "crates/clw-cache",
    "crates/clw-snapshot",
    "crates/clw-hydrate",
    "crates/clw-run",
    "crates/clw-cli",
    "crates/clw-integration-tests",
    "crates/clw-conformance",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
# proprietary — binding terms in EULA.md (M4.2). `LicenseRef-Proprietary` is a
# VALID SPDX expression (the `LicenseRef-` form for non-listed licenses), so
# cargo-deny can evaluate it — unlike the old "UNLICENSED" token, which cargo
# accepts but is NOT a valid SPDX expression (exit-gate #5 failure). It inherits
# cleanly across the workspace via `.workspace = true` (`license-file` does NOT
# inherit, only `license`, which is why the inheritable `license` field is used).
# The real, binding posture is EULA.md + `publish = false` on every crate; this
# field is just the SPDX-valid proprietary marker. See deny.toml LICENSE POSTURE.
license = "LicenseRef-Proprietary"
repository = "https://github.com/HumanGuardrail/corelink-workspaces"

[workspace.dependencies]
clw-types = { path = "crates/clw-types" }
clw-chunk = { path = "crates/clw-chunk" }
clw-client = { path = "crates/clw-client" }
clw-manifest = { path = "crates/clw-manifest" }
clw-cache = { path = "crates/clw-cache" }
clw-snapshot = { path = "crates/clw-snapshot" }
clw-hydrate = { path = "crates/clw-hydrate" }
clw-run = { path = "crates/clw-run" }
assert_cmd = "2"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
# tokio feature union is intentionally workspace-wide. M4 evaluated scoping the
# broad features per-crate (only clw-run uses `process`/`fs`; `sync`/`time`/
# `macros`/`rt-multi-thread` are used across most crates via tokio::test/main,
# Semaphore/Mutex/mpsc, etc.). Because cargo unifies features additively across
# the workspace, per-crate narrowing yields no real isolation while risking a
# broken build, so the union is kept here as the single source of truth.
# `process` is the only feature confined to one crate (clw-run) — revisit if
# that crate is ever split out.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
# `url` is the same RFC-3986 parser reqwest uses to resolve the host it dials, so
# the https-only / loopback credential guard is judged on the EXACT dial host
# (never a hand-split authority). Already in the tree transitively via reqwest;
# licensed MIT/Apache-2.0 (allow-listed).
url = "2"
fastcdc = "3"
clap = { version = "4", features = ["derive"] }
# Diagnostic tracing (M5.1). `tracing` is the lib-side instrumentation facade
# (debug!/warn! events on the DIAGNOSTIC channel — distinct from user-facing
# stdout). `tracing-subscriber` is the CLI-side fmt sink to stderr; default
# features are off and only fmt/ansi/env-filter are pulled in to keep the dep
# surface (and license set) minimal. All licenses are MIT (already allow-listed).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
ignore = "0.4"
hex = "0.4"
anyhow = "1"
tempfile = "3"
proptest = "1"
wiremock = "0.6"
filetime = "0.2"
# Microbenchmark harness for hot paths (dev-only; never a runtime dep). Default
# features are off to drop the optional HTML/plotting backend (plotters etc.)
# and keep the dev-dep + license surface minimal; `cargo-criterion` is the
# external runner if richer reports are ever wanted. All pulled-in licenses are
# permissive and already allow-listed in deny.toml/about.toml.
criterion = { version = "0.5", default-features = false }

[profile.release]
lto = "thin"
