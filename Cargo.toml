[workspace]
resolver = "2"
members = [
    "crates/clw-types",
    "crates/clw-chunk",
    "crates/clw-client",
    "crates/clw-manifest",
    "crates/clw-cache",
    "crates/clw-snapshot",
    "crates/clw-hydrate",
    "crates/clw-run",
    "crates/clw-cli",
    "crates/clw-integration-tests",
    "crates/clw-conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# proprietary — binding terms in EULA.md (M4.2). The SPDX-correct way to mark a
# closed-source crate is `license-file = "EULA.md"`, but cargo CANNOT inherit
# `license-file` across the workspace via `.workspace = true` (only `license`
# inherits). Switching only the root to license-file while crates inherit
# `license` would half-break the graph, so the literal "UNLICENSED" token is
# kept (cargo accepts it) as the inheritable marker; the real, binding posture
# is EULA.md + `publish = false` on every crate. See deny.toml LICENSE POSTURE.
license = "UNLICENSED"
repository = "https://github.com/humangr-labs/corelink-workspaces"

[workspace.dependencies]
clw-types = { path = "crates/clw-types" }
clw-chunk = { path = "crates/clw-chunk" }
clw-client = { path = "crates/clw-client" }
clw-manifest = { path = "crates/clw-manifest" }
clw-cache = { path = "crates/clw-cache" }
clw-snapshot = { path = "crates/clw-snapshot" }
clw-hydrate = { path = "crates/clw-hydrate" }
clw-run = { path = "crates/clw-run" }
assert_cmd = "2"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
# tokio feature union is intentionally workspace-wide. M4 evaluated scoping the
# broad features per-crate (only clw-run uses `process`/`fs`; `sync`/`time`/
# `macros`/`rt-multi-thread` are used across most crates via tokio::test/main,
# Semaphore/Mutex/mpsc, etc.). Because cargo unifies features additively across
# the workspace, per-crate narrowing yields no real isolation while risking a
# broken build, so the union is kept here as the single source of truth.
# `process` is the only feature confined to one crate (clw-run) — revisit if
# that crate is ever split out.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
fastcdc = "3"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
hex = "0.4"
anyhow = "1"
tempfile = "3"
proptest = "1"
wiremock = "0.6"
filetime = "0.2"

[profile.release]
lto = "thin"
