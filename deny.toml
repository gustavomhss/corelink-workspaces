# cargo-deny configuration — supply-chain policy for proprietary distribution.
#
# WP M4 (supply-chain metadata). Authored against cargo-deny 0.19.8 (config
# schema v2). Tuned for a CLOSED-SOURCE, commercially-distributed binary: every
# third-party crate that ships inside `clw` must carry a permissive license
# whose obligations we can satisfy by attribution, every advisory is a hard
# failure, and every dependency must come from crates.io.
#
# Run:  cargo deny --all-features check
#
# ---------------------------------------------------------------------------
# LICENSE POSTURE (finalized in WP M4.2 — read before editing the allow-list):
#
#   The workspace declares `license = "LicenseRef-Proprietary"` in
#   [workspace.package] of the root Cargo.toml, inherited by all 13 first-party
#   clw-* crates. `LicenseRef-Proprietary` is a VALID SPDX expression (the
#   `LicenseRef-` form reserved for licenses not on the SPDX list), so cargo-deny
#   CAN evaluate it — unlike the old "UNLICENSED" token, which cargo accepts but
#   is not a valid SPDX expression (it failed exit-gate #5). The binding terms
#   for the distributed binary live in EULA.md (commercial End User License
#   Agreement); third-party attributions are generated by cargo-about from
#   about.toml (see NOTICE).
#
#   Why `license` and not `license-file = "EULA.md"`: cargo cannot inherit
#   `license-file` across the workspace via `.workspace = true` (only `license`
#   inherits). The SPDX-valid `LicenseRef-Proprietary` token is the inheritable
#   marker; EULA.md + `publish = false` carry the real, binding posture. See the
#   matching comment on the `license` field in the root Cargo.toml.
#
#   How cargo-deny is satisfied: two complementary mechanisms cover the
#   first-party crates. (1) Every clw-* crate is `publish = false`, so the
#   [licenses].private `ignore = true` setting below exempts them from the
#   license check structurally. (2) `LicenseRef-Proprietary` is ALSO listed
#   explicitly in the `allow` set, so the first-party posture is accepted even
#   if a crate is ever evaluated directly. Either way there are no per-crate
#   clarify blocks and no false "Unlicense" grant. Only third-party crates are
#   gated against the permissive allow-list. SINGLE SOURCE OF TRUTH: the
#   third-party allow-list is mirrored by `accepted` in about.toml — change both
#   together (the `LicenseRef-Proprietary` first-party atom lives only here).
# ---------------------------------------------------------------------------

[graph]
# Evaluate every feature so the scan also covers the `live` feature path of
# clw-conformance and any other feature-gated dependency edge. Default targets
# (= all targets) is correct for the cross-platform release matrix (M2.2).
all-features = true

[advisories]
# RustSec advisory database posture. v2 schema defaults already DENY any crate
# with an open vulnerability advisory, so no severity-threshold key is needed
# (those keys are deprecated in v2). We additionally refuse yanked crates.
version = 2
yanked = "deny"
# No silent waivers. Any RUSTSEC exception MUST be a dated, justified,
# owner-approved entry here (RUSTSEC id + reason + date) — never a blanket
# ignore. Keep this list empty until such an entry is consciously added.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# First-party posture: every clw-* crate is `publish = false` and carries the
# SPDX-valid `LicenseRef-Proprietary` token (proprietary; binding terms in
# EULA.md). Treat those private crates as exempt from the license check. This
# replaces the 13 per-crate [[licenses.clarify]] blocks that were temporary in
# M4 — the trip-wire is now structural: any new first-party crate is covered
# automatically as long as it stays `publish = false`, and a first-party crate
# that is accidentally made publishable will still pass via the explicit
# `LicenseRef-Proprietary` allow below.
private = { ignore = true }
# Permissive SPDX atoms ACTUALLY present in the current Cargo.lock, enumerated
# from the dependency graph (not aspirational). All are attribution-only or
# more permissive — every one is compatible with proprietary redistribution.
#
# NOTE on CDLA-Permissive-2.0: this is webpki-roots' license (the bundled
# Mozilla root-CA set pulled in via rustls). CDLA-Permissive-2.0 is a
# permissive, attribution-style data license with NO copyleft / share-alike
# obligation — safe to ship inside a closed-source binary. It is allowed
# explicitly and deliberately, not by accident.
allow = [
    # First-party proprietary marker (clw-* crates; binding terms in EULA.md).
    # A valid SPDX `LicenseRef-` expression; complements `private.ignore` above.
    # This atom is first-party only and is intentionally NOT mirrored into
    # about.toml's `accepted` (which lists third-party permissive licenses).
    "LicenseRef-Proprietary",
    # Third-party permissive set (mirrored by `accepted` in about.toml).
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
# A few transitive duplicate versions exist today (e.g. windows-sys); warn rather
# than block so a transitive bump does not break CI on an unrelated PR. The exact
# count is left unstated so this note does not go stale on a dependency bump.
multiple-versions = "warn"
# The internal path deps use wildcard ("*") version reqs. Every workspace crate
# is `publish = false`, so `allow-wildcard-paths` exempts exactly those
# first-party path deps while a wildcard on any THIRD-PARTY (crates.io) dep is a
# hard failure. M4.2 flips this from the temporary "warn" to "deny" now that the
# publish=false precondition holds — wildcard third-party version reqs are
# unacceptable in a closed-source supply chain (non-reproducible builds).
wildcards = "deny"
allow-wildcard-paths = true
# Pinned-version bans (the supply-chain FLOOR). `bytes` is held at exactly the
# lowest non-vulnerable release vs RUSTSEC-2026-0007 (1.11.1) with zero headroom;
# the advisories lane catches the vulnerable versions by RUSTSEC id, but a
# lockfile that drifts BELOW the patched version could otherwise resolve silently
# on an older index. Deny `bytes < 1.11.1` so any such regression fails the gate
# deterministically — defence in depth alongside the [advisories] check.
deny = [{ name = "bytes", version = "<1.11.1" }]
skip = []
skip-tree = []

[sources]
# Dependencies must originate from crates.io and nowhere else: no unknown
# registries, no git sources. This is the closed-supply-chain guarantee.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
