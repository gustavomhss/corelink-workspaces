# cargo-deny configuration — supply-chain policy for proprietary distribution.
#
# WP M4 (supply-chain metadata). Authored against cargo-deny 0.19.8 (config
# schema v2). Tuned for a CLOSED-SOURCE, commercially-distributed binary: every
# third-party crate that ships inside `clw` must carry a permissive license
# whose obligations we can satisfy by attribution, every advisory is a hard
# failure, and every dependency must come from crates.io.
#
# Run:  cargo deny --all-features check
#
# ---------------------------------------------------------------------------
# LICENSE POSTURE (finalized in WP M4.2 — read before editing the allow-list):
#
#   The workspace declares `license = "UNLICENSED"` in [workspace.package] of
#   the root Cargo.toml, inherited by all 11 first-party clw-* crates.
#   "UNLICENSED" is the cargo convention for "no public license granted" (i.e.
#   proprietary) but is NOT a valid SPDX *expression*, so cargo-deny cannot
#   evaluate it. The binding terms for the distributed binary live in EULA.md
#   (commercial End User License Agreement); third-party attributions are
#   generated by cargo-about from about.toml (see NOTICE).
#
#   Why the field is still the literal "UNLICENSED" and not
#   `license-file = "EULA.md"`: cargo cannot inherit `license-file` across the
#   workspace via `.workspace = true` (only `license` inherits). Switching only
#   the root to license-file while crates inherit `license` would half-break
#   the dependency graph, so the literal token is kept as the inheritable
#   marker and EULA.md + `publish = false` carry the real posture. See the
#   matching comment on the `license` field in the root Cargo.toml.
#
#   How cargo-deny is satisfied: every clw-* crate is `publish = false`, so the
#   [licenses].private `ignore = true` setting below exempts the first-party
#   crates from the license check entirely (no per-crate clarify blocks needed,
#   and no false "Unlicense" grant). Only third-party crates are license-gated,
#   against the permissive allow-list. SINGLE SOURCE OF TRUTH: that allow-list
#   is mirrored by `accepted` in about.toml — change both together.
# ---------------------------------------------------------------------------

[graph]
# Evaluate every feature so the scan also covers the `live` feature path of
# clw-conformance and any other feature-gated dependency edge. Default targets
# (= all targets) is correct for the cross-platform release matrix (M2.2).
all-features = true

[advisories]
# RustSec advisory database posture. v2 schema defaults already DENY any crate
# with an open vulnerability advisory, so no severity-threshold key is needed
# (those keys are deprecated in v2). We additionally refuse yanked crates.
version = 2
yanked = "deny"
# No silent waivers. Any RUSTSEC exception MUST be a dated, justified,
# owner-approved entry here (RUSTSEC id + reason + date) — never a blanket
# ignore. Keep this list empty until such an entry is consciously added.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# First-party posture: every clw-* crate is `publish = false` and carries the
# non-SPDX "UNLICENSED" token (proprietary; binding terms in EULA.md). Treat
# those private crates as exempt from the license check rather than mapping
# them to a misleading SPDX token. This replaces the 11 per-crate
# [[licenses.clarify]] blocks that were temporary in M4 — the trip-wire is now
# structural: any new first-party crate is covered automatically as long as it
# stays `publish = false`, and a first-party crate that is accidentally made
# publishable will (correctly) fail the license check.
private = { ignore = true }
# Permissive SPDX atoms ACTUALLY present in the current Cargo.lock, enumerated
# from the dependency graph (not aspirational). All are attribution-only or
# more permissive — every one is compatible with proprietary redistribution.
#
# NOTE on CDLA-Permissive-2.0: this is webpki-roots' license (the bundled
# Mozilla root-CA set pulled in via rustls). CDLA-Permissive-2.0 is a
# permissive, attribution-style data license with NO copyleft / share-alike
# obligation — safe to ship inside a closed-source binary. It is allowed
# explicitly and deliberately, not by accident.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
# A single duplicate (windows-sys, 2 versions) exists today; warn rather than
# block so a transitive bump does not break CI on an unrelated PR.
multiple-versions = "warn"
# The internal path deps use wildcard ("*") version reqs. Every workspace crate
# is `publish = false`, so `allow-wildcard-paths` exempts exactly those
# first-party path deps while a wildcard on any THIRD-PARTY (crates.io) dep is a
# hard failure. M4.2 flips this from the temporary "warn" to "deny" now that the
# publish=false precondition holds — wildcard third-party version reqs are
# unacceptable in a closed-source supply chain (non-reproducible builds).
wildcards = "deny"
allow-wildcard-paths = true
# Empty by design — future home for any pinned-version bans (deny) or
# version-skip allowances (skip / skip-tree) once such a need is identified.
deny = []
skip = []
skip-tree = []

[sources]
# Dependencies must originate from crates.io and nowhere else: no unknown
# registries, no git sources. This is the closed-supply-chain guarantee.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
